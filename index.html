/* ============ ASK THE INSTRUCTOR (Test 2) ============ */
let askFilter="All";
function askState(id){return (S.ask&&S.ask[id])||{};}
function askSet(id,patch){S.ask=S.ask||{};S.ask[id]=Object.assign({},S.ask[id],patch);save();}
function askHTML(a){
  const st=askState(a.id);
  return `<div class="q${st.done?" done-good":""}" id="ask-${a.id}"><div class="topic">${esc(a.g)}${a.hi?` · <span class="star">★ ask first</span>`:""}</div><div class="prompt">${esc(a.q)}</div>
    <div class="why"><div class="model">Why it’s unclear</div>${a.why}<div class="model" style="margin-top:8px">What this page uses for now</div>${a.app}<div>${srcTag(a.src)}</div></div>
    <textarea style="margin-top:10px" data-asknote="${a.id}" placeholder="Write what the instructor said…" aria-label="What the instructor said">${esc(st.note||"")}</textarea>
    <div class="row"><button class="btn ${st.done?"soft":"good"}" data-askdone="${a.id}">${st.done?"Mark as still open":"Got an answer"}</button></div></div>`;
}
function askProg(){return `${ASK.filter(a=>askState(a.id).done).length}/${ASK.length} answered`;}
function renderAsk(){
  const groups=["All",...new Set(ASK.map(a=>a.g)),"Ask first","Still open","Answered"];
  const shown=ASK.filter(a=>askFilter==="All"||(askFilter==="Still open"?!askState(a.id).done:askFilter==="Answered"?hasAns(a):askFilter==="Ask first"?a.hi:a.g===askFilter));
  $("#view-ask").innerHTML=`<div class="panel" style="margin-bottom:14px">
    <div class="qhead"><h3>Notes to review with your instructor</h3><span class="prog">${askProg()}</span></div>
    <p style="margin:0 0 10px">These are places where a slide disagrees with itself or with a handwritten note, where a slide asks a question and never answers it, or where something could be on the test and isn’t in the slides. Ask, write the answer in the box, and study from that.</p>
    <div class="row"><button class="btn soft" id="askCopy">Copy the open questions</button></div>
    <div class="lbl">Your answers</div>
    <p style="margin:0 0 4px">Everything you’ve written here, plus your practice progress, in one message you can text or email.</p>
    <div class="row">${navigator.share?`<button class="btn acc" id="ansShare">Send my answers</button>`:""}<button class="btn ${navigator.share?"soft":"acc"}" id="ansCopy">Copy my answers</button></div></div>
  <div class="filters">${groups.map(g=>`<button data-askfilter="${esc(g)}" aria-pressed="${g===askFilter}">${esc(g)}</button>`).join("")}</div>
  ${shown.map(askHTML).join("")||`<div class="panel" style="text-align:center"><h3>Nothing left here</h3><p class="muted">${askFilter==="Answered"?"No answers written yet.":"Every question in this group has an answer."}</p></div>`}`;
}
function hasAns(a){const st=askState(a.id);return !!(st.done||(st.note&&st.note.trim()));}
function answersText(){
  const got=ASK.filter(hasAns), t2q=T2.flatMap(x=>x.qs);
  let out=`Test 2 answers${NAME?" from "+NAME:""}, ${new Date().toLocaleDateString()}\n\nINSTRUCTOR ANSWERS: ${got.length} of ${ASK.length}\n`;
  got.forEach(a=>{const n=(askState(a.id).note||"").trim();out+=`\n[${a.id}] ${a.q} (${a.src})\nAnswer: ${n||"(marked answered, nothing written)"}\n`;});
  out+="\nPRACTICE PROGRESS\n";
  T2.forEach(x=>{const g=secProg(x);out+=`${x.name}: ${g.done}/${g.n} done, ${g.right} right\n`;});
  out+=`Best quiz score: ${S.best_t2||0}/10\n`;
  const miss=t2q.filter(q=>S.ans[q.id]&&!S.ans[q.id].ok);
  if(miss.length){out+="\nMISSED OR MARKED FOR REVIEW\n";miss.forEach(q=>{out+=`- [${q.id}] ${q.q}\n`;});}
  const wrote=t2q.filter(q=>q.type==="open"&&(S.ans["draft-"+q.id]||"").trim());
  if(wrote.length){out+="\nWRITTEN ANSWERS\n";wrote.forEach(q=>{out+=`\n[${q.id}] ${q.q}\nWrote: ${S.ans["draft-"+q.id].trim()}\n`;});}
  return out;
}
function copyText(txt,msg){const done=()=>toast(msg);
  const old=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(err){toast("Couldn’t copy on this device");}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,old); else old();
}
function askText(){
  const open=ASK.filter(a=>!askState(a.id).done); let out="Questions for my instructor (Test 2)\n";
  for(const g of new Set(open.map(a=>a.g))){out+="\n"+g+"\n";open.filter(a=>a.g===g).forEach((a,i)=>{out+=`${i+1}. ${a.q} (${a.src})\n`;});}
  return out;
}
$("#view-ask").addEventListener("click",e=>{
  const t=e.target;
  const f=t.closest("[data-askfilter]"); if(f){askFilter=f.dataset.askfilter;renderAsk();return;}
  const d=t.closest("[data-askdone]"); if(d){const id=d.dataset.askdone;const was=!!askState(id).done;askSet(id,{done:!was});if(!was)toast("Marked as answered");
    if(askFilter==="Still open")renderAsk(); else{$("#ask-"+id).outerHTML=askHTML(ASK.find(a=>a.id===id));$("#view-ask .prog").textContent=askProg();}return;}
  if(t.id==="askCopy"){copyText(askText(),"Copied. Paste it into a note or email.");return;}
  if(t.id==="ansCopy"){copyText(answersText(),"Copied. Paste it into a text or email.");return;}
  if(t.id==="ansShare"){const txt=answersText();navigator.share({title:"Test 2 answers",text:txt}).catch(err=>{if(!err||err.name!=="AbortError")copyText(txt,"Copied instead. Paste it into a text or email.");});return;}
});
$("#view-ask").addEventListener("input",e=>{const id=e.target.dataset.asknote;if(id)askSet(id,{note:e.target.value});});

/* ============ PRACTICE (Test 2: questions by slide deck) ============ */

function secProg(s){return {n:s.qs.length,done:s.qs.filter(q=>S.ans[q.id]).length,right:s.qs.filter(q=>S.ans[q.id]&&S.ans[q.id].ok).length};}
function notesPanel(s){

    <ul class="clean">${s.stars.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="lbl">Easy to mix up</div>
    <ul class="clean">${s.mix.map(x=>`<li>${x}</li>`).join("")}</ul>
  </div>`;
}
function renderTopics(){
  const s=T2.find(x=>x.id===curSec);
  const topics=["All",...new Set(s.qs.map(q=>q.topic))];
  const shown=s.qs.filter(q=>tFilter==="All"||q.topic===tFilter);

  $("#view-topics").innerHTML=`<div class="chips">${T2.map(x=>{const g=secProg(x);return `<button class="chip" data-sec="${x.id}" aria-pressed="${x.id===curSec}">${esc(x.name)} <small>${g.done}/${g.n}</small></button>`;}).join("")}</div>
  <div class="sheet">

      ${shown.map(qHTML).join("")}

    <div class="chartbar"><div class="who">${esc(s.name)}<small>${esc(s.deck)}</small></div><button id="notesShow">Starred notes</button></div>`;

function rerenderTopicQ(q){const el=$("#q-"+q.id);if(el){el.outerHTML=qHTML(q);}const s=T2.find(x=>x.id===curSec);const g=secProg(s);const p=$("#view-topics .prog");if(p)p.textContent=`${g.done}/${g.n} done · ${g.right} right`;const ch=$(`[data-sec="${s.id}"] small`);if(ch)ch.textContent=`${g.done}/${g.n}`;}
$("#view-topics").addEventListener("click",e=>{
  const t=e.target;

$("#view-topics").addEventListener("input",e=>{const id=e.target.dataset.draft;if(id){S.ans["draft-"+id]=e.target.value;save();}});

/* ============ ANESTHETIC LAB ============ */
let laCart=null, laWeight=null, laCardiac=false, laCase=null;
function renderLA(){
  const c=CASES.find(x=>x.id===curCase)||CASES[0];
  if(laCase!==c.id){laCase=c.id;laCart=null;laWeight=c.la.weightLb||150;laCardiac=/Stage 2|158|150/.test(c.bp);}
  const v=laCart?c.la.verdicts[laCart]:null; const cart=CARTS.find(x=>x.id===laCart);
  $("#view-la").innerHTML=`
  <div class="chips">${CASES.map(x=>`<button class="chip" data-lacase="${x.id}" aria-pressed="${x.id===c.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="two">
    <div class="panel">
      <h2 style="font-size:24px">Pick a cartridge for ${esc(c.name)}</h2>
      <p class="muted" style="margin:4px 0 14px">Tap one to see whether it fits this patient’s medical history. The colored band matches the ADA cartridge color code.</p>
      <div class="rack">${CARTS.map(k=>`<button class="cart" data-cart="${k.id}" aria-pressed="${k.id===laCart}"><span class="tube"><i style="background:${k.band}"></i></span><span><span class="nm">${k.nm}</span><br><span class="sub">${k.sub}</span></span></button>`).join("")}</div>
      ${v?`<div class="verdict ${v[0]}"><h3>${esc(cart.nm)} ${esc(cart.sub)} <span class="pill ${v[0]}">${v[0]==="good"?"Good pick":v[0]==="warn"?"Caution":"Avoid"}</span></h3><p style="margin:0 0 6px"><b>${esc(v[1])}</b></p><p style="margin:0">${v[2]}</p></div>`:`<div class="verdict"><p style="margin:0">Choose a cartridge ↑</p></div>`}
      <div class="lbl">Which injections</div><p style="margin:0">${esc(c.la.injections)}</p>
      <div class="lbl">Topical</div><p style="margin:0">${esc(c.la.topical)}</p>
      <div style="margin-top:10px">${srcTag("Standard teaching · epi rule from Manual p.100")}</div>
    </div>
    <div class="panel">
      <h2 style="font-size:24px">Max-dose calculator</h2>
      <p class="muted" style="margin:4px 0 14px">Both limits count: the drug’s mg/kg max and the epi max. The lower one wins. Round down.</p>
      <div class="field"><label for="wt">Weight (lb)</label><input id="wt" type="number" min="20" max="500" value="${laWeight}"><span class="mono muted" id="kg">= ${(laWeight/2.2).toFixed(1)} kg</span>${c.la.weightLb?"":`<span class="muted" style="font-size:13px">(the case doesn’t give a weight; 150 lb is a placeholder)</span>`}</div>
      <label class="switch"><input type="checkbox" id="cardiac" ${laCardiac?"checked":""}> Cardiac epi limit (0.04 mg): Stage 2 BP or cardiac client</label>
      <div class="tbl-wrap" style="margin-top:12px"><table class="mrd" id="mrdTable"></table></div>
      <div style="margin-top:10px">${srcTag("Standard teaching (Malamed values) — check your LA course")}</div>
    </div>
  </div>`;
  renderMRD();
}
function renderMRD(){
  const kg=laWeight/2.2, epiMax=laCardiac?0.04:0.2;
  const rows=CARTS.map(k=>{const d=DRUGS[k.drug];let mg=d.perKg?Math.min(kg*d.perKg,d.max):d.max;const byDrug=mg/d.mg;const byEpi=k.epi?epiMax/k.epi:Infinity;const lim=Math.min(byDrug,byEpi);
    return `<tr><td><span class="sw" style="background:${k.band}"></span>${k.nm} <span class="muted" style="font-weight:400">${k.sub}</span></td><td>${mg.toFixed(0)} mg</td><td>${byDrug.toFixed(1)}</td><td>${k.epi?byEpi.toFixed(1):"—"}</td><td class="lim">${Math.floor(lim*2)/2}</td></tr>`;}).join("");
  $("#mrdTable").innerHTML=`<tr><th>Cartridge</th><th>Drug max</th><th>Carts by drug</th><th>Carts by epi</th><th>Max carts</th></tr>`+rows;
  const kgEl=$("#kg"); if(kgEl) kgEl.textContent="= "+kg.toFixed(1)+" kg";
}
$("#view-la").addEventListener("click",e=>{const cc=e.target.closest("[data-lacase]");if(cc){curCase=cc.dataset.lacase;renderLA();return;}const b=e.target.closest("[data-cart]");if(b){const k="la-"+laCase+"-"+b.dataset.cart;const first=!S.ans[k];laCart=b.dataset.cart;if(first){S.ans[k]=1;save();addXP(2,b);}renderLA();}});
$("#view-la").addEventListener("input",e=>{if(e.target.id==="wt"){const v=parseFloat(e.target.value);if(v>0){laWeight=v;renderMRD();}}if(e.target.id==="cardiac"){laCardiac=e.target.checked;renderMRD();}});

let deckFilter="All", deckOrder=null, cardIdx=0, flipped=false;
function curCards(){return TEST==="t2"?CARDS2:CARDS;}
function ck(i){return TEST==="t1"?i:TEST+"-"+i;} // each test keeps its own card progress
function deck(){return curCards().map((c,i)=>({...c,i})).filter(c=>deckFilter==="All"||c.d===deckFilter||(deckFilter==="Again"&&S.cards[ck(c.i)]==="again"));}
function renderCards(){
  let d=deck(); if(deckOrder) d=deckOrder.map(i=>d.find(c=>c.i===i)).filter(Boolean);
  if(cardIdx>=d.length) cardIdx=0;
  const all=curCards();
  const decks=["All",...new Set(all.map(c=>c.d)),"Again"];
  const known=all.filter((c,i)=>S.cards[ck(i)]==="know").length;
  const c=d[cardIdx];
  $("#view-cards").innerHTML=`<div class="deckbar"><div class="filters" style="margin:0">${decks.map(x=>`<button data-deck="${x}" aria-pressed="${x===deckFilter}">${x==="Again"?"Review pile":x}</button>`).join("")}</div><span class="prog">${known}/${all.length} known · <button class="ghost" id="shuf">Shuffle</button></span></div>
  ${c?`<div class="card-stage"><div class="fcard${flipped?" flip":""}" id="fcard" tabindex="0" role="button" aria-label="Flip card">
    <div class="face front"><span class="deck-t">${esc(c.d)} · ${cardIdx+1}/${d.length}</span><div class="big">${c.f}</div><span class="hint">tap or press space to flip</span></div>
    <div class="face back"><span class="deck-t">${esc(c.d)}</span><div>${c.b}</div><div>${srcTag(c.s)}</div></div>
  </div></div>
  <div class="cardnav"><div class="navrow"><button class="btn bad" id="again">Review again</button><button class="btn good" id="know">Know it</button></div><div class="navrow"><button class="btn soft" id="prev">← Prev</button><button class="btn soft" id="next">Next →</button></div></div>`
  :`<div class="panel" style="text-align:center"><h3>Review pile is empty</h3><p class="muted">Cards you mark “Review again” land here.</p></div>`}`;
}
function moveCard(n){const len=deck().length;if(!len)return;cardIdx=(cardIdx+n+len)%len;flipped=false;renderCards();}
$("#view-cards").addEventListener("click",e=>{
  const t=e.target;
  const dk=t.closest("[data-deck]"); if(dk){deckFilter=dk.dataset.deck;deckOrder=null;cardIdx=0;flipped=false;renderCards();return;}
  if(t.closest("#fcard")){flipped=!flipped;$("#fcard").classList.toggle("flip",flipped);return;}
  if(t.id==="prev")moveCard(-1); if(t.id==="next")moveCard(1);
  if(t.id==="shuf"){const d=deck().map(c=>c.i);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}deckOrder=d;cardIdx=0;flipped=false;renderCards();toast("Shuffled");}
  if(t.id==="know"||t.id==="again"){let d=deck();if(deckOrder)d=deckOrder.map(i=>d.find(c=>c.i===i)).filter(Boolean);const c=d[cardIdx];if(!c)return;const was=S.cards[ck(c.i)];S.cards[ck(c.i)]=t.id;save();if(t.id==="know"&&was!=="know")addXP(3,t);if(deckFilter==="Again"&&t.id==="know"){deckOrder=null;flipped=false;renderCards();}else moveCard(1);}
});
document.addEventListener("keydown",e=>{if(tab!=="cards"||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key===" "){e.preventDefault();const f=$("#fcard");if(f){flipped=!flipped;f.classList.toggle("flip",flipped);}}if(e.key==="ArrowRight")moveCard(1);if(e.key==="ArrowLeft")moveCard(-1);});

/* ============ QUIZ ============ */
let Q=null;
function pool(){return TEST==="t2"?T2.flatMap(s=>s.qs).filter(q=>q.type==="mc"):[...CASES.flatMap(c=>c.qs).filter(q=>q.type==="mc"),...GENQ];}
function bestKey(){return TEST==="t1"?"best":"best_"+TEST;}
function qFrom(q){const cs=CASES.find(x=>x.qs.some(y=>y.id===q.id));if(cs)return cs.name;const s=T2.find(x=>x.qs.some(y=>y.id===q.id));return s?s.name:"Manual";}
function newQuiz(onlyMiss){let p=pool();if(onlyMiss&&Q)p=p.filter(q=>Q.missed.includes(q.id));for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}Q={items:p.slice(0,Math.min(10,p.length)).map(q=>q.id),i:0,score:0,picked:null,missed:[]};renderQuiz();}
function renderQuiz(){
  const v=$("#view-quiz");
  if(!Q){v.innerHTML=`<div class="panel" style="max-width:680px;margin:0 auto"><h2 style="font-size:28px">Lightning round</h2><p>${TEST==="t2"?"10 random questions from the indices, sealants, and scaling & root planing slides.":"10 random questions from every case plus the manual’s rules."} Best score: <b class="mono">${S[bestKey()]||0}/10</b></p><div class="row"><button class="btn acc" id="startQ">Start the quiz</button></div></div>`;return;}
  if(Q.i>=Q.items.length){const pct=Math.round(Q.score/Q.items.length*100);if(Q.score>(S[bestKey()]||0)&&Q.items.length===10){S[bestKey()]=Q.score;save();}
    v.innerHTML=`<div class="panel" style="max-width:680px;margin:0 auto"><div class="score"><span class="big">${Q.score}/${Q.items.length}</span><span class="muted">${pct>=90?"Ready. Go get it.":pct>=75?"Passing. Tighten up the misses.":"Keep going. Redo the misses."}</span></div>
    ${Q.missed.length?`<div class="lbl">Missed</div><ul class="clean">${Q.missed.map(id=>`<li>${esc(pool().find(q=>q.id===id).q)}</li>`).join("")}</ul>`:""}
    <div class="row">${Q.missed.length?`<button class="btn bad" id="retryMiss">Redo just the misses</button>`:""}<button class="btn acc" id="startQ">New quiz</button></div></div>`;return;}
  const q=pool().find(x=>x.id===Q.items[Q.i]);
  v.innerHTML=`<div class="panel" style="max-width:680px;margin:0 auto">
    <div class="qhead"><span class="prog">Question ${Q.i+1} of ${Q.items.length}</span><span class="prog">Score ${Q.score}</span></div>
    <div class="qbar"><i style="width:${Q.i/Q.items.length*100}%"></i></div>
    <div class="q" style="border:0;padding:0"><div class="topic">${esc(q.topic)} · ${esc(qFrom(q))}</div><div class="prompt">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o,i)=>{let c="opt";if(Q.picked!==null){if(i===q.ans)c+=" right";else if(i===Q.picked)c+=" wrong";}return `<button class="${c}" data-qi="${i}" ${Q.picked!==null?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>
    ${Q.picked!==null?`<div class="why">${q.why}<div>${srcTag(q.src)}</div></div><div class="row"><button class="btn" id="nextQ">${Q.i+1<Q.items.length?"Next →":"See score"}</button></div>`:""}</div></div>`;
}
$("#view-quiz").addEventListener("click",e=>{const t=e.target;
  if(t.id==="startQ")newQuiz(false); if(t.id==="retryMiss")newQuiz(true);
  if(t.id==="nextQ"){Q.i++;Q.picked=null;renderQuiz();}
  const o=t.closest("[data-qi]"); if(o&&Q.picked===null){const q=pool().find(x=>x.id===Q.items[Q.i]);Q.picked=+o.dataset.qi;if(Q.picked===q.ans){Q.score++;addXP(5,o);}else Q.missed.push(q.id);renderQuiz();}
});

      <dt>Detect</dt><dd>Explorer 57% · x-ray 67% · Diagnodent 90% · CariVu = transillumination</dd>
      <dt>Diagnodent</dt><dd>0–14 none · 15–20 prevention · 21–30 by risk · &gt;30 treat</dd></dl>
      <div>${srcTag("Sealants slide 4–35")}</div></div>
    <div class="panel cram"><h3>NSPT: goals and planning</h3><dl class="kv">
      <dt>Gold standard</dt><dd>Periodontal debridement</dd>
      <dt>Goals</dt><dd>Less inflammation and BOP · reduced pockets · CAL stable or better · less biofilm</dd>
      <dt>Flora</dt><dd>Before: anaerobic, gram −, motile. After: aerobic, gram +, nonmotile</dd>
      <dt>Calculus</dt><dd>Not a direct cause · retains biofilm</dd>
      <dt>Cementum</dt><dd>Preserve · growth factors for new attachment</dd>
      <dt>Endotoxin</dt><dd>LPS from gram-negative cell walls · removed by scaling</dd>
      <dt>Visits</dt><dd>1 week apart · Stage I–II: 2 quads per visit</dd>
      <dt>Re-eval</dt><dd>4–8 weeks after completion</dd>
      <dt>Consent</dt><dd>Written is most legally sound · refusal form</dd></dl>
      <div>${srcTag("SRP slide 2–26")}</div></div>
    <div class="panel cram"><h3>Hand instruments</h3><dl class="kv">
      <dt>Adapt</dt><dd><b>Toe third</b></dd>
      <dt>Angulation</dt><dd>Insert ~0° · work 45–90° (70°)</dd>
      <dt>Direction</dt><dd>Curette: base of pocket → CEJ</dd>
      <dt>Root planing</dt><dd>Stay sub · multidirectional · lighter finishing strokes</dd>
      <dt>Multi-root</dt><dd>Trunk first · each root as a single root · distal portion = distal curette</dd>
      <dt>Horizontal</dt><dd>Concavities. Proximal: G11 → G12, G13 → G14. Facial/lingual: same end</dd>
      <dt>Gracey</dt><dd>1–6 anterior · 7–10 post. B/L · 11/12, 15/16 post. F/L/M · 13/14, 17/18 post. D</dd>
      <dt>Langer</dt><dd>1/2 mand post · 3/4 max post · 5/6 ant · 17/18 post · face 90°</dd>
      <dt>Shanks</dt><dd>Standard ≤4 mm · extended &gt;4 mm, 3 mm longer</dd>
      <dt>File</dt><dd>Crush / roughen · two-point contact · vertical pull</dd></dl>
      <div>${srcTag("SRP slide 49–122")}</div></div>
    <div class="panel cram"><h3>Ultrasonics</h3><dl class="kv">
      <dt>Types</dt><dd>Ultrasonic (piezo, magneto) · sonic</dd>
      <dt>Frequency</dt><dd>Vibrations per second</dd>
      <dt>Amplitude</dt><dd>Stroke length · what the power knob changes</dd>
      <dt>Power</dt><dd>Rarely above medium</dd>
      <dt>3 A’s</dt><dd>Adapt 2–3 mm · angle 0–15° · activate 1–2 mm overlapping strokes</dd>
      <dt>Direction</dt><dd>CEJ → apically</dd>
      <dt>Water</dt><dd>Fluid lavage: cools, flushes</dd>
      <dt>Staged</dt><dd>Standard tip, higher power → slim tip, lower power</dd>
      <dt>Curved tips</dt><dd>Right/left = direction of the curve · need both</dd></dl>
      <div>${srcTag("SRP slide 71–98")}</div></div>
    <div class="panel cram"><h3>Root anatomy</h3><dl class="kv">
      <dt>Max 1st molar</dt><dd>3 roots (MB, DB, P) · furcations F, M, D</dd>
      <dt>Mand 1st molar</dt><dd>2 roots (M, D) · furcations F, L · begins just apical to CEJ</dd>
      <dt>2nd molars</dt><dd>Longer root trunk · roots closer together</dd>
      <dt>Max 1st premolar</dt><dd>Bifurcated (B, L) · mesial concavity</dd>
      <dt>Max canine</dt><dd>Longest root · oval · proximal concavities</dd>
      <dt>Max lateral</dt><dd>Palatogingival groove</dd>
      <dt>3rd molars</dt><dd>Vary greatly · may be fused</dd></dl>
      <div>${srcTag("SRP slide 29–45 class notes")}</div></div>
    <div class="panel cram"><h3>Fulcrums</h3><dl class="kv">
      <dt>Modified intraoral</dt><dd>Lower contact point between middle and ring fingers</dd>
      <dt>Cross arch</dt><dd>Other side of the same arch</dd>
      <dt>Opposite arch</dt><dd>The other jaw</dd>
      <dt>Finger-on-finger</dt><dd>Rest on the non-dominant finger</dd>
      <dt>Extraoral</dt><dd>Knuckle rest · chin cup · grasp farther back · palm out</dd>
      <dt>Finger assist</dt><dd>Non-dominant finger pushes the shank</dd>
      <dt>Downsides</dt><dd>More skill · instrument stick · less tactile · strain · TMJ (extraoral)</dd></dl>
      <div>${srcTag("SRP slide 135–156")}</div></div>
  </div>`;
}

/* ============ RESET ============ */
$("#resetArea").addEventListener("click",e=>{
  if(e.target.id==="resetBtn"){$("#resetArea").innerHTML=`<span class="confirm">Erase all progress, both tests? <button class="btn bad" id="resetYes" style="padding:5px 10px">Erase</button><button class="ghost" id="resetNo">Keep</button></span>`;}
  if(e.target.id==="resetNo"){$("#resetArea").innerHTML=`<button class="ghost" id="resetBtn">Start over</button>`;}
  if(e.target.id==="resetYes"){const keep=S.ask;S={xp:0,ans:{},cards:{},best:0};if(keep)S.ask=keep;/* instructor answers are notes, not progress */save();Q=null;laCart=null;$("#resetArea").innerHTML=`<button class="ghost" id="resetBtn">Start over</button>`;renderHUD();setTab(tab);toast("Progress erased");}
});

/* petals */
(function(){const p=$("#petals");if(!p)return;let h="";for(let i=0;i<18;i++){const l=Math.random()*100,d=9+Math.random()*10,dl=-Math.random()*20,s=.7+Math.random()*.8;h+=`<span style="left:${l}%;animation-duration:${d}s;animation-delay:${dl}s;transform:scale(${s})"></span>`;}p.innerHTML=h;})();

/* who: modal + switching */
function renderWho(){
  $("#whoName").textContent=NAME||"Add your name";
  const list=profiles();
  $("#whoList").innerHTML=list.map(n=>`<span><button type="button" data-pick="${esc(n)}" aria-pressed="${n===NAME}">${esc(n)}</button>${list.length>1||n!==NAME?`<button type="button" class="del" data-del="${esc(n)}" title="Remove ${esc(n)} and their progress">✕</button>`:""}</span>`).join("");
  $("#whoCancelRow").hidden=!NAME;
}
function openWho(){renderWho();$("#whoModal").hidden=false;setTimeout(()=>$("#whoInput").focus(),50);}
function chooseName(n){
  n=n.trim().slice(0,24); if(!n)return;
  const list=profiles(); if(!list.includes(n)){list.push(n);lsSet("hcl-profiles",JSON.stringify(list));}
  // first name on a device that already has unnamed progress: carry it over
  const newKey="hcl-v1-"+slug(n);
  if(!lsGet(newKey)&&!NAME&&lsGet("hcl-v1")){lsSet(newKey,lsGet("hcl-v1"));lsDel("hcl-v1");}
  lsSet("hcl-name",n); location.reload();
}
$("#whoBtn").addEventListener("click",openWho);
$("#whoCancel").addEventListener("click",()=>{$("#whoModal").hidden=true;});
$("#whoForm").addEventListener("submit",e=>{e.preventDefault();chooseName($("#whoInput").value);});
$("#whoList").addEventListener("click",e=>{
  const p=e.target.closest("[data-pick]"); if(p){chooseName(p.dataset.pick);return;}
  const d=e.target.closest("[data-del]"); if(d){const n=d.dataset.del;if(d.dataset.sure!=="1"){d.dataset.sure="1";d.textContent="remove?";return;}
    lsSet("hcl-profiles",JSON.stringify(profiles().filter(x=>x!==n)));lsDel("hcl-v1-"+slug(n));if(n===NAME){lsDel("hcl-name");location.reload();}else renderWho();}
});
renderWho(); if(!NAME) openWho();

/* boot */
renderHUD();
// open on the test used last; first visit opens the newest test
let startTest=lsGet(KEY+"-test"); if(!TESTS.some(t=>t.id===startTest)) startTest=TESTS[TESTS.length-1].id;
let startTab=null;
const h=(location.hash||"").slice(1);
if(h){
  if(TESTS.find(t=>t.id===startTest).tabs.some(x=>x[0]===h)) startTab=h;
  else{const o=TESTS.find(t=>t.tabs.some(x=>x[0]===h)); if(o){startTest=o.id;startTab=h;}}
}
setTest(startTest,startTab);
</script>
