     why:"The slide shows primary, secondary and tertiary prevention. The handwritten notes put <b>sealants under primary</b> and <b>therapeutic sealants under secondary</b>, because a therapeutic sealant treats an early lesion that already exists.",
     src:"Sealants slide 2 class note"},
    {id:"t2s-def",topic:"Basics",type:"mc",q:"A pit and fissure sealant is best described as what?",
     opts:["A fluoride-releasing varnish painted on smooth surfaces","A thin plastic resinous coating that acts as a physical barrier to oral bacteria and carbohydrates","A temporary filling for cavitated lesions","A desensitizing agent"],ans:1,
     why:"A <b>thin plastic resinous coating</b> that is a <b>physical barrier</b> to oral bacteria and carbohydrates. It keeps debris, food and bacteria out of pits and fissures. Placed early, <b>before cavitation</b>, it is an effective barrier.",
     src:"Sealants slide 5 ★"},
    {id:"t2s-90",topic:"Basics",type:"mc",q:"About how much of the caries in permanent teeth occurs in pits and fissures?",

     why:"About <b>90%</b>, with <b>molars</b> the most susceptible. Do not confuse it with <b>76%</b>, which is the reduction in risk of new carious lesions for children and adolescents who get sealants.",

    {id:"t2s-access",topic:"Basics",type:"mc",q:"What do the slides say about sealants and family income?",
     opts:["Income makes no difference","Fewer than 20% of children living in poverty have sealants, compared with 32% in higher-income homes","Children in poverty get more sealants through school programs","90% of children have sealants"],ans:1,
     why:"<b>Less than 20%</b> of children living in poverty have received sealants, compared with <b>32%</b> of children in higher-income homes.",
     src:"Sealants slide 4"},
    {id:"t2s-pvt",topic:"Basics",type:"mc",q:"What is a therapeutic sealant?",
     opts:["One placed on a completely healthy, caries-free tooth","One applied to a tooth with an early, non-cavitated (incipient) enamel lesion","One placed over a cavitated lesion into dentin","One placed on a primary tooth about to exfoliate"],ans:1,
     why:"<b>Therapeutic</b> = applied to teeth with <b>early, non-cavitated (incipient) lesions in enamel</b>; minor, superficial drilling may occur. <b>Preventive</b> = placed on completely healthy, sound, caries-free teeth.",
     src:"Sealants slide 6 ★"},
    {id:"t2s-sealed",topic:"Basics",type:"mc",q:"Early caries gets sealed over with a well-placed sealant. What usually happens?",
     opts:["The caries speeds up","The caries process typically stops, because the food source is cut off","The sealant dissolves","Nothing changes"],ans:1,
     why:"The caries process typically <b>stops</b> because a <b>food source is no longer available</b>. If the sealant is poorly placed, the margins can leak and the caries can continue.",
     src:"Sealants slide 5"},
    {id:"t2s-effects",topic:"Basics",type:"open",q:"Name the three primary preventive effects of sealants.",
     model:"<ol><li>They provide a <b>mechanical barrier</b> in the pit and fissure.</li><li>They <b>eliminate the environment</b> that favors <i>Streptococcus mutans</i>.</li><li>They make the occlusal pits and fissures <b>easier to clean</b> by brushing and chewing.</li></ol>",
     src:"Sealants slide 7"},
    {id:"t2s-ind",topic:"Who gets one",type:"open",q:"List the indications for sealants.",
     model:"<ul><li>Children with <b>newly erupted teeth</b> that have pits and fissures (class note: teeth must be <b>fully erupted</b>)</li><li>Older individuals with <b>reduced salivary flow</b></li><li>Clients in <b>orthodontics</b></li><li><b>Incipient caries</b></li><li><b>Caries history</b></li><li>Anyone who wants them and for whom it is technically feasible</li></ul>Tooth selection: not every tooth needs one. Recommended for <b>steep cuspal inclines</b> and <b>deep, sticky fissures</b>.",
     src:"Sealants slide 8–9"},
    {id:"t2s-contra",topic:"Who gets one",type:"mc",q:"Which of these is a contraindication for a sealant?",
     opts:["A fully erupted molar with deep, sticky fissures","A partially erupted molar with an operculum","A patient in orthodontic treatment","An older adult with reduced salivary flow"],ans:1,
     why:"<b>Insufficiently erupted teeth / operculum</b> is on the contraindication list: you cannot keep the tooth dry. The other three are indications.",
     src:"Sealants slide 8, 10"},
    {id:"t2s-contra2",topic:"Who gets one",type:"open",q:"List the contraindications for sealants.",
     model:"<ul><li>Behavior / lack of patient cooperation</li><li><b>Clinically evident caries</b></li><li><b>Proximal decay</b> (seen interproximally)</li><li><b>Insufficiently erupted</b> teeth / operculum</li><li>Primary teeth with a <b>short life expectancy</b></li><li><b>Radiographic evidence</b> of decay</li><li><b>Self-cleaning</b> pits and fissures</li><li><b>Allergy to methacrylate</b> (it is in the sealant material)</li><li><b>Previous restoration</b></li></ul>",
     src:"Sealants slide 10"},
    {id:"t2s-fail",topic:"Retention",type:"mc",q:"What is the most common reason a sealant fails?",
     opts:["The curing light was too far away","Salivary contamination during placement","The patient chewed too soon","Too little etch"],ans:1,
     why:"<b>Salivary contamination</b> during placement. Class note: “it gets wet.” Saliva is detrimental to the etched surface, which is why you isolate, use suction, and change cotton rolls.",
     src:"Sealants slide 11, 23 ★"},
    {id:"t2s-retain",topic:"Retention",type:"open",q:"For good retention, what four things must be true of the tooth surface?",
     model:"<ol><li><b>Maximum surface area</b> (class note: cover as much area as possible)</li><li><b>Deep, irregular</b> pits and fissures</li><li><b>Clean</b></li><li><b>Completely dry</b> at placement and <b>uncontaminated with saliva</b></li></ol>Sequence: the surface is <b>etched</b>, an optional primer is applied, then the adhesive resin.",
     src:"Sealants slide 11–12 ★"},
    {id:"t2s-etchwhy",topic:"Retention",type:"mc",q:"What does the acid etch (conditioner) do?",
     opts:["Hardens the sealant","Produces micropores in the enamel so the liquid resin can flow in and bond","Whitens the tooth permanently","Kills the pulp bacteria"],ans:1,
     why:"It produces <b>irregularities or micropores</b> in the enamel so the liquid resin can <b>penetrate and create a bond</b> (micromechanical). It also removes contamination, has an antibacterial action, and increases the surface area. An etched tooth looks <b>chalky white</b>.",
     src:"Sealants slide 13, 22 ★"},
    {id:"t2s-etchwhat",topic:"Placement",type:"mc",q:"Which etchant is used, and at what strength?",
     opts:["Hydrofluoric acid 10%","Phosphoric acid, most commonly 37% (range 15–50%)","Citric acid 50%","Hydrogen peroxide 3%"],ans:1,
     why:"<b>Phosphoric acid, most commonly 37%</b> (the slide gives a range of 15–50%). It comes as liquid, gel or semi-gel.",
     src:"Sealants slide 20, 22"},
    {id:"t2s-etchtime",topic:"Placement",type:"mc",q:"How long do you etch, and what must you avoid?",
     opts:["5 seconds; avoid drying the tooth","A minimum of 15–60 seconds depending on the manufacturer; avoid contact with oral tissues","2 minutes; avoid rinsing","20–30 seconds under the curing light"],ans:1,
     why:"Etch a minimum of <b>15–60 seconds</b>, depending on the manufacturer. <b>Do not contact oral tissues</b> (class note: it can cause irritation or a chemical burn).",
     src:"Sealants slide 22 + class note"},
    {id:"t2s-rinse",topic:"Placement",type:"mc",q:"After etching, how long do you rinse and how long do you dry?",
     opts:["Rinse 5 s, dry 5 s","Rinse at least 30 s, dry 15–20 s","Rinse 15 s, dry 60 s","No rinse; air dry 10 s"],ans:1,
     why:"<b>Rinse at least 30 seconds</b>, use suction (high volume if possible), change cotton rolls, then <b>dry 15–20 seconds</b>. Check the air stream for moisture first. Look for the <b>white, chalky</b> surface.",
     src:"Sealants slide 23"},
    {id:"t2s-steps",topic:"Placement",type:"open",q:"Write the sealant placement steps in order.",
     model:"<ol><li><b>Clean</b> the tooth surface and <b>isolate</b></li><li><b>Etch</b> the enamel with 37% phosphoric acid</li><li><b>Rinse</b> with water</li><li><b>Dry</b> the enamel</li><li><b>Bonding</b> agent (optional)</li><li><b>Place</b> the sealant</li><li><b>Cure</b></li><li><b>Wipe</b> the cured surface with gauze or a cotton roll (oxygen-inhibited layer)</li></ol>Then check the bite, check retention, and apply fluoride.",
     src:"Sealants slide 20"},
    {id:"t2s-clean",topic:"Placement",type:"mc",q:"Which is a method the slides list for cleaning the tooth before a sealant?",
     opts:["Pumice and a bristle brush on a slow-speed handpiece","Prophy paste with fluoride and oil","Chlorhexidine rinse only","Ultrasonic scaling"],ans:0,
     why:"The slide lists: hydrogen peroxide, air/powder polishing, acid etch (the conditioner helps clean enamel), <b>pumice and bristle brush on a slow-speed handpiece</b>, and a wet toothbrush.",
     src:"Sealants slide 21"},
    {id:"t2s-apply",topic:"Placement",type:"mc",q:"When you apply the sealant material, which is correct?",
     opts:["Overfill so it covers the cusps","Spread it with an explorer, wait 10 seconds, then cure with the light held a few millimeters above","Cure first, then spread","Touch the light tip to the resin"],ans:1,
     why:"Place the material in the pits and fissures and <b>do not overfill</b>. Spread with an <b>explorer</b> and <b>wait 10 seconds</b>. Cure with the light held <b>a few millimeters above</b> the resin. Always use the dark yellow disk to filter the blue light.",
     src:"Sealants slide 25 ★"},
    {id:"t2s-cure",topic:"Material",type:"mc",q:"How long is the usual light-cure time?",
     opts:["5–10 seconds","20–30 seconds","60 seconds","2 minutes"],ans:1,
     why:"Usually <b>20–30 seconds</b>, depending on the manufacturer. It is a <b>blue light</b>, so use the protective shield or glasses.",
     src:"Sealants slide 17, 25 ★"},
    {id:"t2s-auto",topic:"Material",type:"mc",q:"Which is true of autopolymerized (self-curing) sealants?",
     opts:["They harden only under blue light","Polymerization starts as soon as mixing begins; they are common in school-based programs","They never need a dry field","They take 30 minutes to set"],ans:1,
     why:"Self-cure mixes a universal liquid monomer with a catalyst, and <b>polymerization starts as soon as mixing begins</b>. Commonly used in <b>school-based sealant programs</b>. You must keep the field dry while mixing.",
     src:"Sealants slide 17 ★"},
    {id:"t2s-mono",topic:"Material",type:"mc",q:"Liquid sealant is the ____; hardened sealant is the ____.",
     opts:["polymer; monomer","monomer (resin); polymer","filler; catalyst","etchant; primer"],ans:1,
     why:"<b>Liquid sealant = resin = monomer.</b> Polymerization turns it into the <b>hard sealant = polymer</b>. Polymerization is the process by which sealants harden.",
     src:"Sealants slide 17–18"},
    {id:"t2s-comp",topic:"Material",type:"mc",q:"What is sealant material made of?",
     opts:["Amalgam alloy","A resin based on a dimethacrylate monomer, such as bis-GMA or UDMA, similar to composite resin","Zinc oxide eugenol","Calcium hydroxide"],ans:1,
     why:"It is <b>similar to composite resin</b>. The resin component is a dimethacrylate monomer: <b>bis-GMA</b> (bisphenol A-glycidyl methacrylate) or <b>UDMA</b> (urethane dimethacrylate), with small filler particles.",
     src:"Sealants slide 15"},
    {id:"t2s-types",topic:"Material",type:"open",q:"Give the three ways sealants are classified, and name the four types of material.",
     model:"<b>Classified by:</b><ul><li><b>Type:</b> glass ionomer and resin</li><li><b>Polymerization method:</b> autopolymerized and photopolymerized</li><li><b>Filler:</b> filled and unfilled</li></ul><b>Four types of material:</b><ol><li>Resin-based sealants</li><li>Polyacid-modified resin sealants</li><li>Glass ionomer cements</li><li>Resin-modified glass ionomer sealants</li></ol>",
     src:"Sealants slide 16"},
    {id:"t2s-ideal",topic:"Material",type:"mc",q:"Which is an ideal property of a sealant material?",
     opts:["Thick, high viscosity so it stays on the cusps","Free-flowing and low viscosity so it can enter narrow fissures","Sets only when wet","Needs a complex application"],ans:1,
     why:"Ideal properties: <b>prolonged bonding</b> to enamel, <b>biocompatible</b> with oral tissue, a <b>simple application</b> procedure, and a <b>free-flowing, low-viscosity</b> material that can enter narrow fissures.",
     src:"Sealants slide 14"},
    {id:"t2s-color",topic:"Material",type:"mc",q:"Why would a clinician choose a colored sealant?",
     opts:["It bonds better","It is easier to see during application and to re-evaluate at recall","It releases more fluoride","It cures faster"],ans:1,
     why:"Sealants come clear, tinted, opaque or white. <b>Colored sealants are easier to see</b> during application and at recall appointments.",
     src:"Sealants slide 19"},
    {id:"t2s-voids",topic:"Placement",type:"mc",q:"After curing, you find a void with the explorer. What can you do?",
     opts:["Nothing; the sealant must be drilled out","Add more material, as long as the surface is not contaminated","Re-etch for 60 seconds over the sealant","Polish it away"],ans:1,
     why:"Check for voids with an <b>explorer</b>. <b>More material can be added if the surface is not contaminated.</b>",
     src:"Sealants slide 25"},
    {id:"t2s-occl",topic:"Placement",type:"mc",q:"How do you check and fix a high spot on a new sealant?",
     opts:["Ask the patient to chew gum","Articulating paper to find it; a scaler or curette to remove the excess","Re-cure for 60 seconds","Apply more etch"],ans:1,
     why:"Use <b>articulating paper</b> (the blue paper) to check for high spots, a <b>scaler or curette</b> to remove excess, and <b>dental floss</b> to check the interproximal areas.",
     src:"Sealants slide 26"},
    {id:"t2s-filled",topic:"Placement",type:"mc",q:"Which sealant needs its height adjusted after placement?",
     opts:["Unfilled","Filled","Neither","Both equally"],ans:1,
     why:"<b>Filled</b> sealants <b>require adjustment</b>. <b>Unfilled</b> sealants wear down to the correct height on their own.",
     src:"Sealants slide 26"},
    {id:"t2s-redo",topic:"Placement",type:"mc",q:"You check the finished sealant with an explorer and it lifts off. What now?",
     opts:["Leave it and recheck in 6 months","Repeat the placement, with only about 15 seconds of etching; if two attempts fail, postpone until remineralization occurs","Etch for 2 minutes and place a thicker layer","Place it without etching"],ans:1,
     why:"Repeat the procedure with only about <b>15 seconds</b> of etching. If <b>two attempts</b> are unsuccessful, <b>postpone</b> until remineralization occurs.",
     src:"Sealants slide 27"},
    {id:"t2s-fl",topic:"Follow-up",type:"mc",q:"When is the fluoride treatment done on a sealant visit?",
     opts:["Before etching","Between etch and sealant","After the sealants are placed","Fluoride is never given the same day"],ans:2,
     why:"<b>After</b> the sealants are placed, to promote remineralization. It is starred and handwritten on the slide.",
     src:"Sealants slide 28 ★"},
    {id:"t2s-maint",topic:"Follow-up",type:"mc",q:"How often are sealants checked, and what do you tell the patient?",
     opts:["Every 5 years; they are permanent","Every 6 months; sealants are no guarantee against caries, only one part of preventive care","Only if one falls off","Every month"],ans:1,
     why:"Check <b>every 6 months</b> for deficiencies. Sealants provide <b>no guarantee</b> that the patient will not get caries; they are only a part of preventive care.",
     src:"Sealants slide 29 ★"},
    {id:"t2s-dx90",topic:"Caries detection",type:"mc",q:"According to the slides, which is most effective at detecting decay?",
     opts:["Explorer (57%)","Radiographs (67%)","Diagnodent laser (90%)","Disclosing solution"],ans:2,
     why:"Explorers <b>57%</b> · radiographs <b>67%</b> · Diagnodent <b>90%</b>. The Diagnodent measures <b>laser fluorescence</b> in tooth structure. It finds hidden caries, avoids exploratory opening of suspect teeth, uses light energy (no x-ray exposure), and takes about 5 minutes.",
     src:"Sealants slide 31–32"},
    {id:"t2s-dxval",topic:"Caries detection",type:"mc",q:"A Diagnodent reading of 25 means what?",
     opts:["No active care","No active care; prevention recommended","Preventive treatment or active care, depending on the patient’s caries risk","Active treatment required"],ans:2,
     why:"<b>0–14</b> no active care · <b>15–20</b> no active care, prevention recommended · <b>21–30</b> preventive treatment or active care depending on caries risk · <b>over 30</b> active treatment.",
     src:"Sealants slide 33"},
    {id:"t2s-carivu",topic:"Caries detection",type:"mc",q:"How does the CariVu device show caries?",
     opts:["Laser fluorescence gives a number","Transillumination: enamel looks transparent, and caries and cracks look dark","It stains decay blue","It uses low-dose x-rays"],ans:1,
     why:"CariVu uses <b>transillumination</b>. Enamel appears transparent; <b>caries and cracks absorb light and appear dark</b>.",
     src:"Sealants slide 35"}
  ]
},
{
  id:"nspt", name:"Scaling & root planing", deck:"Nonsurgical Periodontal Therapy · 168 slides",
  blurb:"Goals of nonsurgical periodontal therapy, appointment planning and consent, root anatomy, hand and ultrasonic technique, specialized instruments, and advanced fulcrums.",
  stars:[
    "<b>Management of modifiable risk factors</b> is part of initial therapy.",
    "Goals: <b>reduce pocket depths</b> and <b>eliminate bleeding on probing</b>. #1 is less gingival inflammation and BOP.",
    "<b>Calculus is NOT a direct cause</b> of gingival inflammation. “It is the biofilm that lives on top.”",
    "<b>Preserve cementum.</b> It allows for reattachment.",
    "“Important to know <b>root anatomy</b>.”",
    "Curette: <b>always adapt the toe third</b>.",
    "Root planing: <b>stay sub</b>. Get in the pocket and stay in the pocket.",
    "Multi-rooted teeth: <b>treat each root as though it is a single-rooted tooth</b>.",
    "<b>Langer:</b> face at 90° to the lower shank. <b>Extended shank</b> = pockets over 4 mm.",
    "<b>Mini Gracey:</b> shorter working-end, good for mandibular anteriors.",
    "<b>Vision Curvette:</b> the + mark shows the lower cutting edge.",
    "<b>O’Hehir:</b> working-end is a tiny circular disk.",
    "<b>Finger assist</b> (stabilized fulcrum) is starred.",
    "Scale a quadrant <b>to completion before</b> moving to the next one."
  ],
  mix:[
    "<b>Curette vs ultrasonic direction:</b> curette starts at the base of the pocket and works toward the CEJ; powered tip starts near the CEJ and works apically.",
    "<b>Frequency vs amplitude:</b> frequency = how many vibrations per second; amplitude = how far the tip moves. The power knob changes amplitude.",
    "<b>Standard vs extended shank:</b> 4 mm or less vs greater than 4 mm. Extended lower shank is 3 mm longer.",
    "<b>Cross arch vs opposite arch:</b> cross arch = other side of the same arch; opposite arch = the other jaw.",
    "<b>Finger-on-finger vs finger assist:</b> finger-on-finger is a rest for the fulcrum; finger assist pushes on the shank for lateral pressure.",
    "<b>Horizontal strokes on proximal surfaces</b> use the opposite working-end (G11 vertical → G12 horizontal). On facial and lingual, same end.",
    "<b>Re-evaluation</b> in this deck is 4–8 weeks after NSPT is finished."
  ],
  qs:[
    {id:"t2p-gold",topic:"NSPT goals",type:"mc",q:"What is the gold standard of initial periodontal therapy?",
     opts:["Systemic antibiotics","Periodontal debridement","Periodontal surgery","Chlorhexidine rinse"],ans:1,
     why:"<b>Periodontal debridement = gold standard.</b> Initial therapy also includes managing modifiable risk factors, patient education, antimicrobials as appropriate (class note example: Arestin), eliminating local factors (overhanging restorations), and re-evaluation to see whether the patient needs surgery or maintenance.",
     src:"SRP slide 2 ★"},
    {id:"t2p-success",topic:"NSPT goals",type:"open",q:"Long-term success of NSPT depends on which four things?",
     model:"<ol><li><b>Daily biofilm control by the patient</b> (class note: what they do at home)</li><li><b>Management of modifiable risk factors</b></li><li><b>Regular periodontal maintenance</b> (class note: how often they come to the clinic)</li><li>A <b>skilled clinician</b> providing definitive debridement at the start and on an ongoing basis</li></ol>Class note on patient education: doing it without any change at home is basically worthless.",
     src:"SRP slide 3, 9"},
    {id:"t2p-flora",topic:"NSPT goals",type:"mc",q:"Before treatment, the predominant subgingival flora in periodontal infection is what?",
     opts:["Aerobic, gram-positive, nonmotile cocci","Anaerobic, gram-negative, motile (spirochetes, motile rods)","Fungal","Viral"],ans:1,
     why:"<b>Before:</b> anaerobic, gram-negative, motile, spirochetes and motile rods, pathogenic; very high microbial count; many leukocytes. <b>After:</b> aerobic, gram-positive, nonmotile, coccoid forms, nonpathogenic; much lower counts; fewer leukocytes.",
     src:"SRP slide 7"},
    {id:"t2p-aims",topic:"NSPT goals",type:"open",q:"List the five aims and expected outcomes of NSPT.",
     model:"<ol><li><b>Interrupt or arrest</b> the progress of disease (less biofilm, slower repopulation of pathogens, change patient habits).</li><li><b>Create an environment that encourages health</b> and resolution of inflammation: reduce pocket depths, eliminate bleeding on probing, restore normal tissue, increase attachment level, remove calculus and restorative irregularities.</li><li><b>Induce positive changes</b> in the quality and quantity of subgingival flora.</li><li><b>Provide initial preparation for surgery</b> in advanced disease.</li><li><b>Education and motivation</b>: the patient takes on the co-therapist role.</li></ol>",
     src:"SRP slide 5–9 ★"},
    {id:"t2p-calc",topic:"NSPT goals",type:"mc",q:"What is the role of calculus in gingival inflammation?",
     opts:["It is the direct cause","It is NOT a direct cause; it holds biofilm against the tissue","It protects the root","It has no role"],ans:1,
     why:"<b>Calculus is not a direct cause</b> of gingival inflammation. It <b>causes biofilm retention</b>. Class note: “it is the biofilm that lives on top.” Ideal endpoint: disrupt biofilm and remove calculus while <b>preserving cementum</b>.",
     src:"SRP slide 18 ★"},
    {id:"t2p-cem",topic:"NSPT goals",type:"mc",q:"Why should cementum be preserved as much as possible?",
     opts:["It is harder than enamel","It is a source of growth factors for new attachment","It prevents stain","It cannot be removed anyway"],ans:1,
     why:"Some cementum removal during calculus removal is inevitable, but cementum is a <b>source of growth factors for new attachment</b>. Class note: our goal is preservation of cementum; it allows for reattachment.",
     src:"SRP slide 17"},
    {id:"t2p-endo",topic:"NSPT goals",type:"mc",q:"Endotoxins (lipopolysaccharides) come from where?",
     opts:["The cell walls of gram-negative bacteria","Saliva","Calculus crystals","Gram-positive cocci"],ans:0,
     why:"They come from the <b>cell walls of gram-negative bacteria</b> and trigger the inflammatory host response that leads to periodontitis. They exist in biofilm and <b>can be removed with scaling</b>.",
     src:"SRP slide 17"},
    {id:"t2p-ging",topic:"NSPT goals",type:"mc",q:"For biofilm-induced gingivitis, what is the therapeutic goal?",
     opts:["Pocket reduction surgery","Reversal of inflammation to establish gingival health by eliminating the cause","Occlusal stabilization","Bone grafting"],ans:1,
     why:"<b>Reversal of inflammation to establish gingival health</b> through elimination of etiologic factors: complete scaling plus the patient’s daily biofilm removal. For Stage I–II periodontitis the goals are less inflammation and BOP, reduced pocket depths, CAL stabilized or improved, and less biofilm.",
     src:"SRP slide 11–12 ★"},
    {id:"t2p-sev",topic:"NSPT goals",type:"mc",q:"What is added for moderate-to-severe periodontitis (Stage III or IV)?",
     opts:["Nothing; same as gingivitis","Adjunctive chemotherapeutics and specialized instruments for deep pockets and furcations","Only a prophy","Fluoride trays"],ans:1,
     why:"Supplemental measures such as <b>adjunctive chemotherapeutics</b> (class note: Arestin) may be needed, and <b>specialized instruments</b> for deep pockets, furcations and complex anatomy. Goals are the same as mild-to-moderate, plus radiographic improvement in osseous lesions and <b>occlusal stabilization</b>.",
     src:"SRP slide 13"},
    {id:"t2p-surg",topic:"NSPT goals",type:"mc",q:"A patient will need periodontal surgery. What does NSPT do for them first?",
     opts:["Replaces the surgery","Prepares the tissues by reducing the bacterial load and the inflammation","Numbs the area","Nothing"],ans:1,
     why:"NSPT <b>prepares the tissues for surgery by reducing the bacterial load and reducing inflammation</b>. Surgical categories: gingival augmentation (grafts), regenerative (bone grafting, guided tissue regeneration), and resective (flaps, osseous surgery, gingivectomy).",
     src:"SRP slide 8, 14"},
    {id:"t2p-comp",topic:"NSPT goals",type:"open",q:"Name the four components of NSPT and give an example of each.",
     model:"<ol><li><b>Preventive:</b> oral–systemic education, fluoride varnish, home antimicrobials and irrigation, smoking cessation, dietary counseling, desensitizing, implant care.</li><li><b>Dental biofilm removal:</b> biofilm and endotoxin are removed with scaling.</li><li><b>Calculus removal:</b> calculus retains biofilm; preserve cementum.</li><li><b>Restorative biofilm-retentive factors:</b> removal of <b>overhanging restorations is critical</b>.</li></ol>",
     src:"SRP slide 15–19"},
    {id:"t2p-single",topic:"Planning & consent",type:"mc",q:"Which patient fits a single-appointment plan?",
     opts:["Generalized Stage III with 6 mm pockets","Gingivitis, minimal inflammation, small deposits, reasonable self-care","Heavy subgingival calculus in all quadrants","A patient who needs anesthesia in four quadrants"],ans:1,
     why:"Single appointment: diagnosis of <b>gingivitis</b>, minimal inflammation and small deposits, localized involvement, anesthesia may not be needed, reasonable self-care and an acceptable biofilm score.",
     src:"SRP slide 25"},
    {id:"t2p-multi",topic:"Planning & consent",type:"mc",q:"Quadrant scaling appointments are spaced how far apart, and why?",
     opts:["The same day","About 1 week, for oral self-care and healing of the treated areas","3 months","6 months"],ans:1,
     why:"<b>1-week intervals</b>, for oral self-care and healing of previously treated areas. Plan by quadrant or sextant depending on severity. <b>Stage I–II</b> patients can have <b>2 quadrants</b> in one appointment. Class note: scale a quad to completion before moving on to the next one.",
     src:"SRP slide 26 + class note"},
    {id:"t2p-reeval",topic:"Planning & consent",type:"mc",q:"When is re-evaluation best done after NSPT is completed?",
     opts:["The next day","1 week","4–8 weeks, to allow for connective tissue healing","1 year"],ans:2,
     why:"<b>4–8 weeks</b> after completion, to allow <b>connective tissue healing</b>. Healing is also checked at each appointment. Any residual calculus is removed, then you set the <b>maintenance interval and/or refer for surgical treatment</b>.",
     src:"SRP slide 26"},
    {id:"t2p-consent",topic:"Planning & consent",type:"open",q:"What has to be covered for informed consent?",
     model:"<ul><li>Expected successful outcomes</li><li><b>Risks</b> involved</li><li>Possible unexpected results</li><li><b>Alternative</b> approaches</li><li>Possible <b>consequences of refusing</b> treatment</li><li><b>Costs</b></li><li>The patient’s <b>capacity to consent</b> (age, mental, language)</li><li><b>Written consent</b> by the patient</li></ul>Two-way communication is the best way to start the process.",
     src:"SRP slide 21–23"},
    {id:"t2p-written",topic:"Planning & consent",type:"mc",q:"Which form of consent is the most legally sound?",
     opts:["Implied","Verbal","Written: the plan signed by the patient and the hygienist in the chart","All are equal"],ans:2,
     why:"<b>Written consent</b>: the plan signed by the patient and the hygienist in the patient chart. Verbal or implied consent is not as legally sound.",
     src:"SRP slide 23"},
    {id:"t2p-refuse",topic:"Planning & consent",type:"mc",q:"A fully informed patient refuses periodontal therapy and asks for “just a regular cleaning.” What applies?",
     opts:["Do the prophy; the patient chooses","The patient may refuse; document it with a refusal form. Refusing perio therapy does not make a prophy the right treatment","Dismiss the patient immediately","Do the SRP anyway"],ans:1,
     why:"Patients may refuse treatment after being fully informed, and specific treatments (radiographs, fluoride) can be refused. <b>Include the refusal form</b> with the informed consent. Class note: if a patient declines perio therapy, it does not mean you can just do a prophy; “it’s like putting a bandaid on a gunshot wound.”",
     src:"SRP slide 23–24 + class note"},
    {id:"t2p-prep",topic:"Hand technique",type:"open",q:"What do you review and examine before you start instrumenting?",
     model:"<ol><li>The patient’s <b>assessment record</b></li><li><b>Radiographic findings</b> (class note: we need radiographs)</li><li>The <b>care plan and treatment records</b></li><li><b>Patient preparation</b></li><li><b>Supragingival examination</b> (class note: blow air)</li><li><b>Subgingival examination</b></li><li><b>Formulate a strategy</b> for instrumentation</li></ol>",
     src:"SRP slide 46"},
    {id:"t2p-steps",topic:"Hand technique",type:"open",q:"List the manual subgingival scaling steps in order.",
     model:"<ol><li>Selection and sequence of instruments</li><li>Instrument grasp</li><li>Stabilization: establish the fulcrum</li><li>Select the correct cutting edge</li><li>Adaptation of the cutting edge</li><li>Angulation</li><li>Lateral pressure</li><li>Activation: stroke</li><li>Channels of strokes: coverage</li><li>Plane the root surface</li><li>Evaluation</li></ol>Before any of it, the prerequisites (class note): use the explorer, use radiographs, have good lighting. Work in a methodical way.",
     src:"SRP slide 47–48, 53"},
    {id:"t2p-compo",topic:"Hand technique",type:"open",q:"Name the nine components of effective instrumentation.",
     model:"<ol><li>Grasp</li><li>Fulcrum</li><li>Insertion</li><li>Adaptation</li><li>Angulation</li><li>Lateral pressure</li><li>Stroke direction</li><li>Stroke length</li><li>Reinforcement</li></ol>",
     src:"SRP slide 124"},
    {id:"t2p-parallel",topic:"Hand technique",type:"mc",q:"A Gracey curette is placed correctly when its lower shank is in what position relative to the tooth surface?",
     opts:["Perpendicular to it","Parallel to it","Tilted 45° away from it","Resting on the occlusal surface"],ans:1,
     why:"The slide shows two placements of the Gracey 1/2; the correct one is checked, and the handwritten note says it <b>should be parallel</b>. With a Gracey, a lower shank parallel to the surface puts the cutting edge at the right angulation. Advanced fulcrums are used on molars for the same reason: improved parallelism of the lower shank.",
     src:"SRP slide 133 class note, 138"},
    {id:"t2p-toe",topic:"Hand technique",type:"mc",q:"A curette working-end is divided into thirds. Which third is adapted to the tooth?",
     opts:["Shank third","Middle third","Toe third","All three at once"],ans:2,
     why:"The working-end is shank third, middle third and <b>toe third</b>. Class note: <b>always adapt the toe third</b>.",
     src:"SRP slide 49 class note"},
    {id:"t2p-ang",topic:"Hand technique",type:"mc",q:"A curette is inserted subgingivally at what angulation, and worked at what angulation?",
     opts:["Inserted at 90°, worked at 0°","Inserted at about 0° (closed face), worked between 45° and 90°","Inserted and worked at 0–15°","Inserted at 45°, worked at 120°"],ans:1,
     why:"Insert with the face <b>closed, near 0°</b>, then open to a working angulation <b>between 45° and 90°</b>. The review slide uses <b>70°</b>. Do not confuse this with the ultrasonic tip, which works at 0–15°.",
     src:"SRP slide 50, 162"},
    {id:"t2p-dir",topic:"Hand technique",type:"mc",q:"Removing calculus with a curette: where does the stroke start?",
     opts:["At the CEJ, working apically","Apical to the deposit, at the base of the pocket, working toward the CEJ","In the middle of the deposit","On the enamel"],ans:1,
     why:"With a <b>curette</b>, position the working-end <b>apical to the deposit</b>: start at the <b>base of the pocket</b> and work toward the CEJ. A <b>powered</b> tip is the opposite: start at the coronal-most part of the deposit near the CEJ and work apically.",
     src:"SRP slide 78"},
    {id:"t2p-rp",topic:"Hand technique",type:"mc",q:"Which describes root planing strokes?",
     opts:["Short, heavy strokes in one direction only","Stay subgingival; overlapping vertical, oblique and horizontal strokes; lighten the grasp and pressure for finishing strokes","Strokes above the gingival margin","A single long pull"],ans:1,
     why:"Class notes on these slides: <b>stay sub</b> (get in the pocket and stay in the pocket); <b>overlapping, multidirectional strokes</b> (vertical, oblique, horizontal); <b>lighten the grasp and pressure for finishing strokes</b>. Channel scaling works the same way: overlapping channels so nothing is missed.",
     src:"SRP slide 50, 52, 54 ★"},
    {id:"t2p-horiz",topic:"Hand technique",type:"mc",q:"Why are horizontal strokes needed in root concavities?",
     opts:["They are faster","A vertical stroke often spans across the concavity and misses the deposit","They remove more cementum","They need less pressure"],ans:1,
     why:"Horizontal strokes remove deposits from <b>root concavities and depressions</b>. Vertical strokes are not effective there because the working-end <b>“spans across” the concavity</b> and misses the deposit.",
     src:"SRP slide 63"},
    {id:"t2p-g12",topic:"Hand technique",type:"mc",q:"You used the Gracey 11 for vertical strokes on a mesial surface. Which end makes horizontal strokes on that same surface?",
     opts:["The Gracey 11 again","The Gracey 12, toe-down","The Gracey 13","The Gracey 14"],ans:1,
     why:"On <b>proximal</b> surfaces you switch ends: <b>G11 vertical → G12 horizontal</b> (toe-down), and for distals <b>G13 vertical → G14 horizontal</b>, and vice versa. The G11’s lower cutting edge does not adapt for a horizontal stroke on the mesial. On <b>facial and lingual</b> surfaces, use the <b>same</b> working-end for both.",
     src:"SRP slide 64–69"},
    {id:"t2p-trunk",topic:"Multi-rooted teeth",type:"mc",q:"Instrumenting a multi-rooted tooth: where do you begin, and then what?",
     opts:["Furcation first, then the crown","The root trunk first; then each root branch, treated as if it were the root of a single-rooted tooth","Distal root only","Apex first"],ans:1,
     why:"<b>Step 1: root trunk.</b> Distal curette from the distofacial line angle onto the distal surface; mesial curette from the distofacial line angle across the facial and onto the mesial. <b>Step 2: root branches.</b> Treat each root branch <b>as if it were the root of a single-rooted tooth</b>.",
     src:"SRP slide 56–57 ★"},
    {id:"t2p-branch",topic:"Multi-rooted teeth",type:"mc",q:"Mandibular molar: which curette is used on the distal portion of the MESIAL root?",
     opts:["Mesial curette","Distal curette","Universal only","A file"],ans:1,
     why:"Go by the <b>surface</b>, not the root’s name. <b>Distal portion</b> of either root = <b>distal curette</b>. <b>Mesial portion</b> of either root = <b>mesial curette</b>.",
     src:"SRP slide 58–62"},
    {id:"t2p-max6",topic:"Root anatomy",type:"mc",q:"Maxillary first molar: how many roots, and where are the furcations?",
     opts:["Two roots; facial and lingual furcations","Three roots (mesiobuccal, distobuccal, palatal); furcations on the facial, mesial and distal","One root","Three roots; one furcation on the lingual"],ans:1,
     why:"<b>Trifurcated:</b> MB, DB and palatal roots. Furcations on the <b>facial, mesial and distal</b>. Class note: the buccal furcation is easy to access; the mesial and distal are not.",
     src:"SRP slide 34 class note"},
    {id:"t2p-man6",topic:"Root anatomy",type:"mc",q:"Mandibular first molar: which is correct?",
     opts:["Three roots with a palatal root","Two roots, mesial and distal; facial and lingual furcations; the furcation begins just apical to the CEJ","One fused root","Two roots, buccal and lingual"],ans:1,
     why:"<b>Two roots</b>, mesial and distal (the mesial is larger). <b>Facial and lingual furcations.</b> The mesial root has a concavity. The furcation begins <b>just apical to the CEJ</b>.",
     src:"SRP slide 41 class note"},
    {id:"t2p-max4",topic:"Root anatomy",type:"mc",q:"Which tooth has a bifurcated root with buccal and lingual branches and a prominent mesial concavity?",
     opts:["Maxillary canine","Maxillary first premolar","Mandibular first premolar","Maxillary second premolar"],ans:1,
     why:"<b>Maxillary first premolar:</b> bifurcated (buccal and lingual roots), <b>prominent mesial concavity</b>, CEJ curvature higher on the mesial, furcations on the mesial and distal in the <b>apical third</b>. The maxillary second premolar is single rooted with longer roots and a mesial root concavity.",
     src:"SRP slide 32–33 class note"},
    {id:"t2p-trunk2",topic:"Root anatomy",type:"mc",q:"Compared with first molars, second molars have what kind of root trunk?",
     opts:["Shorter","Longer, because the roots are closer together","None","The same"],ans:1,
     why:"Class notes for both the maxillary and mandibular second molars: the <b>root trunk is longer</b> (roots are closer together). Mandibular second molar: bifurcated, buccal and lingual furcations, roots curve distally, and it <b>might have cervical enamel projections</b>.",
     src:"SRP slide 35, 42 class note ★"},
    {id:"t2p-canine",topic:"Root anatomy",type:"mc",q:"Maxillary canine root: which is correct?",
     opts:["Shortest root in the mouth","Longest root, oval in cross section, with proximal root concavities","Always bifurcated","Round with no concavities"],ans:1,
     why:"Class notes: <b>longest root</b>, <b>oval cross section</b>, <b>proximal root concavities</b>. The curve of the crown on the distal can hinder access to the mesial of the first premolar. The mandibular canine is single rooted but can have a bifurcation, usually in the apical third.",
     src:"SRP slide 31, 38 class note"},
    {id:"t2p-pgg",topic:"Root anatomy",type:"mc",q:"A palatogingival groove is most associated with which tooth?",
     opts:["Maxillary lateral incisor","Mandibular first molar","Maxillary first premolar","Mandibular canine"],ans:0,
     why:"The class note on the <b>maxillary lateral incisor</b> lists a <b>palatal gingival groove</b>, along with cone shaped, single rooted, and thinner than the central. Palatogingival grooves are also on the slide of root form variations.",
     src:"SRP slide 30, 45 class note"},
    {id:"t2p-var",topic:"Root anatomy",type:"open",q:"List the variations in root form from the slides.",
     model:"<ul><li>Fused roots, fusion, and concrescence</li><li>Accessory roots</li><li>Palatogingival grooves</li><li>Hypercementosis</li><li>Cervical enamel projections</li><li>Enamel pearls</li><li>Dilaceration</li></ul>Other things to think about: root shape, number of roots, furcations, root concavities, tooth alignment. Third molar roots vary greatly; mandibular third molar roots can be fused and are shorter and less developed than the second.",
     src:"SRP slide 36, 43–45"},
    {id:"t2p-gracey",topic:"Instruments",type:"mc",q:"Gracey 13/14 is used where on posterior teeth?",
     opts:["Mesial surfaces","Distal surfaces","Buccal and lingual only","All surfaces"],ans:1,
     why:"<b>13/14 and 17/18 = posterior distal.</b> 11/12 and 15/16 = posterior facial, lingual and mesial. 7/8 and 9/10 = premolars and molars, <b>buccal and lingual only</b>. 1/2, 3/4, 5/6 = anterior teeth, all surfaces.",
     src:"SRP slide 113"},
    {id:"t2p-g78",topic:"Instruments",type:"mc",q:"Gracey 7/8 and 9/10 are designed for which surfaces?",
     opts:["Anterior teeth, all surfaces","Premolars and molars, buccal and lingual","Posterior mesial","Posterior distal"],ans:1,
     why:"<b>Premolars and molars; buccal and lingual.</b> The class note adds “only.”",
     src:"SRP slide 113 + class note"},
    {id:"t2p-langer",topic:"Instruments",type:"mc",q:"Which Langer curette is for mandibular posterior teeth?",
     opts:["Langer 1/2","Langer 3/4","Langer 5/6","Langer 17/18"],ans:0,
     why:"<b>1/2 = mandibular posterior</b> · 3/4 = maxillary posterior · 5/6 = anterior · 17/18 = posterior. Langers have the face at <b>90° to the lower shank</b>, <b>two cutting edges</b> per working-end, a long complex shank, and each is limited to certain areas.",
     src:"SRP slide 108, 110 ★"},
    {id:"t2p-langer2",topic:"Instruments",type:"mc",q:"Which Langer curette is recommended for root surface debridement in deep, narrow pockets?",
     opts:["Standard Langer","Miniature Langer","Rigid Langer","Any universal curette"],ans:1,
     why:"<b>Miniature</b> = deep, narrow pockets. <b>Standard</b> = pockets 4 mm or less. <b>Rigid</b> = increased strength for tenacious calculus. <b>Extended shank</b> = pockets greater than 4 mm (starred).",
     src:"SRP slide 109 ★"},
    {id:"t2p-univ",topic:"Instruments",type:"mc",q:"Which of these is listed on the slides as a universal curette?",
     opts:["Gracey 13/14","Columbia 13/14","Quétin furcation curette","Columbia 2R/2L"],ans:1,
     why:"<b>Universal curettes:</b> Barnhart 5/6, <b>Columbia 13/14</b>, Younger-Good 7/8, McCall 13/14. <b>Posterior curettes:</b> Columbia 4R/4L (class note: longer terminal shank), Barnhart 1/2. <b>Anterior curettes:</b> Columbia 2R/2L. Gracey 13/14 is area-specific.",
     src:"SRP slide 111"},
    {id:"t2p-ext",topic:"Instruments",type:"mc",q:"Standard area-specific curettes are designed for pockets of what depth? And extended-shank (modified) curettes?",
     opts:["Standard over 6 mm; extended under 3 mm","Standard 4 mm or less; extended greater than 4 mm","Both any depth","Standard supragingival only"],ans:1,
     why:"<b>Standard: 4 mm or less.</b> <b>Modified / extended shank: greater than 4 mm.</b> The lower shank of the extended curette is <b>3 mm longer</b>, and the working-end is thinner.",
     src:"SRP slide 109, 112, 114 ★"},
    {id:"t2p-mini",topic:"Instruments",type:"mc",q:"How does a miniature Gracey differ from an extended-shank Gracey?",
     opts:["Shorter shank","It also has a shorter working-end","Thicker working-end","It has no cutting edge"],ans:1,
     why:"Both have a longer lower shank and thinner working-end. The <b>mini</b> adds a <b>shorter working-end</b>, which works well even on the tiny roots of the mandibular anteriors. The <b>micro-mini</b> is 20% thinner than the mini and its working-end is 50% shorter than a standard Gracey; used in special areas of difficult access and for fine deposit removal.",
     src:"SRP slide 115–117 ★"},
    {id:"t2p-match",topic:"Instruments",type:"mc",q:"Which instrument has a working-end that is a tiny circular disk, with the entire circumference as a cutting edge?",
     opts:["Quétin furcation curette","O’Hehir / DeMarco debridement curette","Vision Curvette","Diamond-coated instrument"],ans:1,
     why:"<b>O’Hehir / DeMarco:</b> tiny circular disk, cutting edge all the way around. <b>Quétin:</b> miniature hoe, one straight cutting edge with rounded corners, for furcations. <b>Vision Curvette:</b> working-end half the standard length and more curved, raised bands at 5 and 10 mm, + mark at the lower cutting edge. <b>Diamond-coated:</b> no cutting edges; used like an emery board.",
     src:"SRP slide 119–122 ★"},
    {id:"t2p-vision",topic:"Instruments",type:"mc",q:"On a Vision Curvette, what do the raised bands on the lower shank and the + mark tell you?",
     opts:["Bands show wear; + marks the toe","Bands at 5 and 10 mm estimate pocket depth; the + marks the lower cutting edge","Bands mark the grip; + means posterior","They are decorative"],ans:1,
     why:"Two raised bands at <b>5 and 10 mm</b> give a visual estimate of pocket depth. The <b>+</b> on the handle near the shank indicates the <b>lower cutting edge</b>.",
     src:"SRP slide 119 ★"},
    {id:"t2p-file",topic:"Instruments",type:"mc",q:"What is a periodontal file for?",
     opts:["Final root planing","Crushing or roughening a heavy or burnished deposit so another instrument can remove it","Probing furcations","Polishing enamel"],ans:1,
     why:"A file <b>prepares calculus for removal</b>: it <b>crushes large deposits</b>, <b>roughens burnished</b> deposits, and can smooth overhanging amalgam. It is limited to <b>enamel surfaces or the outer surface of a calculus deposit</b>. The shank is rigid, so tactile information is limited.",
     src:"SRP slide 102–104 ★"},
    {id:"t2p-file2",topic:"Instruments",type:"mc",q:"How is a periodontal file used?",
     opts:["Push stroke with the corner of the cutting edge","Two-point contact (working-end on the deposit, lower shank resting on the tooth), face flat, vertical pull stroke","Horizontal stroke in the furcation","Circular motion"],ans:1,
     why:"Keep the <b>face flat</b> against the deposit so the corners do not gouge root or tissue. Use <b>two-point contact</b>: working-end on the calculus AND lower shank against the tooth. Activate a <b>pull stroke in a vertical direction</b>. Each file fits only certain surfaces, so you need a <b>set</b>.",
     src:"SRP slide 103, 105"},
    {id:"t2p-class",topic:"Ultrasonics",type:"mc",q:"How are powered instruments classified?",
     opts:["Hand and rotary","Ultrasonic (piezo and magneto) and sonic","Air and water","Standard and mini"],ans:1,
     why:"Powered instrumentation splits into <b>ultrasonic</b> and <b>sonic</b>. Ultrasonic splits into <b>piezo</b> and <b>magneto</b>.",
     src:"SRP slide 71"},
    {id:"t2p-freq",topic:"Ultrasonics",type:"mc",q:"When you turn the power up on the ultrasonic unit, what are you changing?",
     opts:["Frequency: how many times the tip vibrates per second","Amplitude: how far the tip moves back and forth","Water temperature","Tip length"],ans:1,
     why:"<b>Amplitude</b> (stroke length) is how far the working-end moves; higher amplitude = a stronger stroke. <b>Frequency</b> is how many times it vibrates per second. Class note: amplitude is the one “we can adjust.”",
     src:"SRP slide 74, 76 + class note"},
    {id:"t2p-power",topic:"Ultrasonics",type:"mc",q:"What do the slides say about the power setting?",
     opts:["Always use high","It should rarely be placed above medium","Low power cannot remove biofilm","Power does not matter"],ans:1,
     why:"Research finds <b>no difference in efficiency</b> between high and medium power. For patient comfort and to limit damage to the tooth, the setting should <b>rarely be above medium</b>.",
     src:"SRP slide 76"},
    {id:"t2p-eff",topic:"Ultrasonics",type:"mc",q:"Which combination is ideal for removing plaque biofilm?",
     opts:["High frequency, high amplitude","Low frequency, low amplitude","High frequency, no water","Any, held still on the tooth"],ans:1,
     why:"<b>Low frequency, low amplitude</b> (fewer vibrations, shorter strokes) = biofilm. <b>High frequency, high amplitude</b> = tenacious calculus.",
     src:"SRP slide 77"},
    {id:"t2p-3a",topic:"Ultrasonics",type:"mc",q:"The 3 A’s of ultrasonic instrumentation: which set is right?",
     opts:["Adaptation 2–3 mm of the tip · Angulation 0–15° · Activation 1–2 mm short overlapping strokes","Adaptation 10 mm · Angulation 70° · Activation long pull strokes","Adaptation the point · Angulation 90° · Activation tapping","Adaptation 1 mm · Angulation 45° · Activation none"],ans:0,
     why:"<b>Adaptation:</b> 2–3 mm of the insert tip. <b>Angulation:</b> 0–15°. <b>Activation:</b> 1–2 mm short overlapping strokes, horizontal, oblique and vertical. Class note: never put the tip on the tooth, but it can go on calculus.",
     src:"SRP slide 82 + class note"},
    {id:"t2p-mode",topic:"Ultrasonics",type:"mc",q:"How does a powered tip remove calculus, and what does the water do?",
     opts:["It cuts with a sharp edge; water is for taste","Rapid vibrations create microfractures in the deposit; water (fluid lavage) cools and flushes the pocket","It dissolves calculus chemically","Heat melts it"],ans:1,
     why:"Rapid vibrations create <b>microfractures</b>. The constant stream of water near the tip is <b>fluid lavage</b>: it <b>dissipates heat</b> and <b>flushes toxic products and bacteria</b> from the pocket. It is not a magic wand: use <b>slow, repetitive strokes</b>.",
     src:"SRP slide 73, 80"},
    {id:"t2p-staged",topic:"Ultrasonics",type:"mc",q:"Staged instrumentation: which tip and power for initial debridement?",
     opts:["Slim tip, low power","Standard tip, higher power, for gross removal of moderate–heavy calculus or stain","Curved tip, no water","Diamond tip"],ans:1,
     why:"<b>Initial debridement:</b> gross removal of moderate–heavy calculus or stain with a <b>standard</b> insert and <b>higher</b> power. <b>Definitive debridement:</b> light deposits, biofilm and endotoxin with a <b>slim/modified</b> insert and <b>lower</b> power. Slim perio tips are up to 40% smaller with longer, more complex shanks.",
     src:"SRP slide 87, 90"},
    {id:"t2p-curved",topic:"Ultrasonics",type:"mc",q:"A curved slim tip is labeled “right.” What does that mean?",
     opts:["Use it on the patient’s right side only","It describes the direction the tip itself curves, not where you use it","It is for right-handed clinicians","It is the correct tip"],ans:1,
     why:"“Right” or “left” refers to the <b>direction of the curvature of the tip</b>, not where it is used in the mouth. <b>Both</b> are needed to finish the dentition. For efficiency, do every surface that takes the right tip, then switch. Curved tips improve adaptation on posterior roots, concavities and furcations.",
     src:"SRP slide 94, 96–98"},
    {id:"t2p-stub",topic:"Ultrasonics",type:"open",q:"A calculus deposit will not come off with the ultrasonic. What are your options?",
     model:"<ul><li>Spend <b>adequate time</b> on it; a single quick stroke will not remove it.</li><li>Keep proper <b>control and adaptation</b>; use a <b>combination of strokes in different directions</b> with the correct tip surface.</li><li><b>Change to a different tip</b>, one that works at medium power.</li><li>Start with a hand-activated <b>periodontal file</b> to fracture a tenacious deposit, then use the powered tip.</li><li>You may need to <b>increase the power</b> setting.</li></ul>",
     src:"SRP slide 99–100"},
    {id:"t2p-strengths",topic:"Ultrasonics",type:"open",q:"List the strengths of powered instrumentation.",
     model:"<ul><li>Removes supra- and subgingival <b>calculus</b></li><li>Removes subgingival <b>biofilm</b></li><li>Slim tips reach <b>deeper into pockets</b> than hand instruments</li><li>Slim tips give access to <b>furcations</b></li><li>Water irrigation <b>flushes bacterial products</b> from pockets</li><li><b>Less instrumentation time</b></li></ul>",
     src:"SRP slide 72"},
    {id:"t2p-fulwhy",topic:"Fulcrums",type:"open",q:"Why is a fulcrum important, and what are the key points of a good one?",
     model:"<b>Why:</b> stability · control of the whole hand as a unit · prevents injury · patient comfort · controls the length of the stroke.<br><b>Key points:</b><ul><li>Positioned so you can use <b>wrist motion</b></li><li>Close enough that the <b>middle and fourth fingers stay together</b></li><li><b>Frequently adjusted</b> to maintain angulation</li></ul>Standard intraoral fulcrums give the best stability, leverage, strength and control, better tactile sense, and are the safest.",
     src:"SRP slide 128–130"},
    {id:"t2p-adv",topic:"Fulcrums",type:"mc",q:"Which statement about advanced fulcrums is true?",
     opts:["They replace the standard intraoral fulcrum","They are variations used to reach root surfaces in pockets; they do not replace the standard fulcrum or fix poor technique","They give better tactile sense","They put less strain on the fingers than a standard fulcrum"],ans:1,
     why:"An advanced fulcrum is a <b>variation</b> of the conventional fulcrum used to gain access to root surfaces in pockets. They are <b>not intended to replace</b> standard intraoral fulcrums, which put the <b>least strain</b> on the fingers. Poor skills with a standard fulcrum <b>cannot be corrected</b> by an advanced one.",
     src:"SRP slide 131–132"},
    {id:"t2p-disadv",topic:"Fulcrums",type:"mc",q:"Which is a disadvantage of advanced fulcrums?",
     opts:["Easier access to maxillary second and third molars","Reduced tactile information and a greater risk of instrument stick","Neutral wrist position","Better parallelism of the lower shank"],ans:1,
     why:"Disadvantages: need <b>more muscle coordination and skill</b>, <b>greater risk of instrument stick</b>, <b>reduced tactile information</b>, may cause muscle strain. Extraoral fulcrums are also <b>not well tolerated by patients with TMJ problems</b>. The other three options are advantages.",
     src:"SRP slide 136, 138, 148"},
    {id:"t2p-cross",topic:"Fulcrums",type:"mc",q:"You fulcrum on the left mandibular posteriors while working on the lingual of the right mandibular posteriors. Which fulcrum is this?",
     opts:["Opposite arch","Cross arch","Finger-on-finger","Finger assist"],ans:1,
     why:"<b>Cross arch:</b> the rest is on the <b>opposite side of the same arch</b>. <b>Opposite arch</b> is a rest on the <b>other jaw</b> (fulcrum on mandibular teeth while working on maxillary teeth).",
     src:"SRP slide 140, 142"},
    {id:"t2p-fof",topic:"Fulcrums",type:"mc",q:"Finger-on-finger fulcrum: what is the resting point?",
     opts:["The patient’s chin","A finger of the non-dominant (mirror) hand","The opposite arch","The knuckles against the mandible"],ans:1,
     why:"A finger of the <b>non-dominant hand</b> serves as the resting point for the dominant hand. For a right-handed clinician, the fulcrum finger of the right hand rests on the left index finger.",
     src:"SRP slide 144"},
    {id:"t2p-assist",topic:"Fulcrums",type:"mc",q:"What does a finger assist (stabilized fulcrum) do?",
     opts:["Retracts the cheek","A finger of the non-dominant hand concentrates lateral pressure against the shank","Replaces the grasp","Holds the mirror"],ans:1,
     why:"A finger of the <b>non-dominant hand</b> pushes behind the <b>shank</b> to concentrate <b>lateral pressure</b>. Right-handed clinician: the left index finger presses behind the shank, pushing the working-end forward against the distal surface.",
     src:"SRP slide 155–156 ★"},
    {id:"t2p-mod",topic:"Fulcrums",type:"mc",q:"How is a modified intraoral fulcrum different from a split fulcrum?",
     opts:["They are the same","In the modified fulcrum the ring finger still touches the middle finger, at a lower point of contact; in a split fulcrum they do not touch","The modified fulcrum is extraoral","The split fulcrum uses both hands"],ans:1,
     why:"Modified intraoral fulcrum = an <b>altered point of contact</b> between the middle and ring fingers, lower against the middle finger. It is <b>not</b> a split fulcrum, where the ring finger does not touch the middle finger.",
     src:"SRP slide 139"},
    {id:"t2p-extra",topic:"Fulcrums",type:"mc",q:"For an extraoral fulcrum, how do you hold the instrument and where do you stabilize?",
     opts:["Grasp close to the working-end; rest on the teeth","Grasp farther from the working-end; stabilize the hand against the underlying bone of the jaw","Palm grasp; no rest","Grasp the shank; rest on the lip"],ans:1,
     why:"Grasp the handle <b>farther away from the working-end</b> and stabilize against the <b>underlying bone of the patient’s jaw</b>. Basic extraoral fulcrum: dominant hand rests against the cheek or chin, <b>palm facing out</b>. Two techniques: <b>knuckle rest</b> and <b>chin cup</b>.",
     src:"SRP slide 149–153"},
    {id:"t2p-rev1",topic:"Fulcrums",type:"open",q:"Review slide: you are scaling a 5 mm pocket on the distolingual of #15 with a Gracey 13/14. Which advanced fulcrum helps you adapt the blade at 70° to the distal root surface, and where do you sit?",
     model:"The handwritten answer on the slide is <b>opposite arch</b> fulcrum, seated at <b>8 o’clock</b>.<br>An opposite arch fulcrum rests on the mandibular teeth while you work on the maxillary teeth. It improves parallelism of the lower shank to the molar and gives easier access to maxillary second and third molars.<div class='defend'><b>Check:</b> this answer comes from her handwriting on the slide. Confirm the clock position against your own notes.</div>",

// Spread the right answers across the option slots. The shuffle is fixed per question id,
// so a saved pick still points at the same option next visit. Short scales (0–3, Code 0–4,
// Excellent–Poor) stay in their natural order.
(function(){
  for(const q of T2.flatMap(s=>s.qs)){
    if(q.type!=="mc"||q.opts.every(o=>o.length<=20))continue;
    let h=2166136261; for(const ch of q.id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
    const rnd=()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};
    const order=q.opts.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    const right=q.ans;
    q.opts=order.map(i=>q.opts[i]); q.ans=order.indexOf(right);
  }
})();

const CARDS2 = [
 {d:"PSR",f:"PSR codes 0 through 4: what you see",b:"<ul><li><b>0</b> band visible · no bleeding · no calculus or defective margins</li><li><b>1</b> band visible · <b>bleeding</b></li><li><b>2</b> band visible · <b>calculus or defective restoration</b></li><li><b>3</b> band <b>partially</b> visible · 4–5 mm</li><li><b>4</b> band <b>not visible</b> · over 5.5 mm</li></ul>",s:"Indices slide 12–16 ★"},
 {d:"PSR",f:"PSR code * (asterisk)",b:"Added to the number. Means <b>furcation involvement, mobility, mucogingival problem, or recession over 3.5 mm</b>. With a Code 3 or 4, do a comprehensive exam.",s:"Indices slide 17"},
 {d:"PSR",f:"PSR: what each code needs",b:"<ul><li><b>0</b> preventive care, review plaque control</li><li><b>1</b> OHI + subgingival plaque removal</li><li><b>2</b> OHI + plaque and calculus removal + fix plaque-retentive margins</li><li><b>3</b> more detailed perio exam: that sextant, or full mouth if several</li><li><b>4</b> comprehensive full-mouth exam and charting</li></ul>",s:"Indices slide 12–16"},
 {d:"PSR",f:"The PSR probe",b:"<b>WHO probe.</b> 0.5 mm ball on the end. Colored band from <b>3.5 to 5.5 mm</b>. Metal or plastic. Six sites per tooth, highest code per <b>sextant</b>. Implants are treated like natural teeth.",s:"Indices slide 9–11 ★"},
 {d:"PSR",f:"Who should NOT get a PSR?",b:"<b>Children</b>, and people who have <b>had periodontal treatment in the past</b>. It is a screening and does not replace full charting.",s:"Indices slide 7–8"},
 {d:"PSR",f:"PerioWise: health, gingivitis, periodontitis",b:"<ul><li><b>Health:</b> green visible, no bleeding</li><li><b>Gingivitis:</b> green visible + bleeding on probing</li><li><b>Periodontitis?:</b> red band reached with gingiva at its normal position</li></ul>Always plastic · color coded · safe around implants · autoclave, chemiclave or dry heat.",s:"Indices slide 20–25 ★"},
 {d:"Indices",f:"Simple, cumulative, reversible, irreversible",b:"<ul><li><b>Simple:</b> presence or absence</li><li><b>Cumulative:</b> total experience with a condition</li><li><b>Reversible:</b> can be changed (plaque record)</li><li><b>Irreversible:</b> cannot be changed</li></ul>DMFT is cumulative, simple, irreversible.",s:"Indices slide 30, 32 + class note"},
 {d:"Indices",f:"Ramfjord teeth",b:"<b>#3, 9, 12, 19, 25, 28.</b> Six teeth as a sample of the whole mouth. An index ending in <b>-S</b> (simplified) or <b>-M</b> (modified) used a smaller sample like this.",s:"Indices slide 31"},
 {d:"Indices",f:"Probe, floss, or wooden wedge?",b:"<ul><li><b>Sulcular Bleeding Index:</b> probe · 4 areas · wait 30 s</li><li><b>Gingival Bleeding Index</b> (Carter and Barnes): floss · wait 30 s</li><li><b>Eastman Interdental:</b> wooden wedge 1–2 mm · wait 15 s</li></ul>",s:"Indices slide 37, 48, 49 ★"},
 {d:"Indices",f:"Gingival Index (GI) scores",b:"<ul><li><b>0</b> normal</li><li><b>1</b> slight color/texture change, no bleeding (mild)</li><li><b>2</b> redness, edema, glazing, <b>bleeding on probing</b> (moderate)</li><li><b>3</b> marked redness, ulceration, <b>spontaneous bleeding</b> (severe)</li></ul>4 surfaces per tooth.",s:"Indices slide 38"},
 {d:"Indices",f:"Plaque Index (PLI)",b:"Silness and Löe. <b>Thickness of plaque at the gingival margin</b>, with a <b>probe</b>, 4 surfaces.<br>0 free · 1 small amount · 2 moderate (visible) · 3 large (visible and in the sulcus).",s:"Indices slide 47 ★"},
 {d:"Indices",f:"OHI-S: parts and math",b:"Greene and Vermillion. <b>Debris Index + Calculus Index.</b> Six segments, each scored 0–3 by thirds covered. Each index = total ÷ 6. <b>OHI-S = DI + CI.</b>",s:"Indices slide 35"},
 {d:"Indices",f:"PHP (Patient Hygiene Performance)",b:"Disclose. Each tooth in <b>5 sections</b>, 1 point per section with stain. Total ÷ teeth.<br>Excellent 0 · Good 0.1–1.7 · Fair 1.8–3.4 · Poor 3.5–5.",s:"Indices slide 33"},
 {d:"Indices",f:"Plaque-free score formula",b:"Teeth × <b>4 surfaces</b> = available surfaces. Subtract surfaces with plaque. Divide by available, × 100.<br>Shortcut: <b>100 − PCR %</b>.",s:"Indices slide 46 ★"},
 {d:"Indices",f:"DMFT rules",b:"Decayed, Missing, Filled Teeth. <b>Gold standard.</b> Permanent teeth, capital letters. <b>No third molars</b>, no supernumerary, no retained primary teeth.<br><b>dmft</b> lowercase = primary only. <b>DMFS</b> = surfaces, more detailed, needs radiographs.",s:"Indices slide 39–40 ★"},
 {d:"Indices",f:"CAMBRA",b:"<b>Caries Management by Risk Assessment.</b> A survey of caries risk from diet and environmental factors. Two forms: adults, and age 6 and under.",s:"Indices slide 44 ★"},
 {d:"Indices",f:"Root Caries Index",b:"Teeth with root caries ÷ teeth with <b>exposed root surfaces</b> × 100. Reported as a percentage.",s:"Indices slide 45"},
 {d:"Indices",f:"Basic Screening Survey: 4 indicators",b:"Untreated decay · treated decay · sealants on permanent molars · treatment urgency (none, early, urgent). Reported to <b>NOHSS</b>. Preschoolers: no sealant indicator.",s:"Indices slide 41–42"},
 {d:"Indices",f:"PI vs PDI vs CPITN",b:"<ul><li><b>PI:</b> populations · 0, 1, 2, 4, 6, 8 · 6 = gingivitis with pocketing</li><li><b>PDI:</b> 0–6 · 4 = attachment loss under 3 mm · 5 = 3–6 mm · 6 = over 6 mm</li><li><b>CPITN:</b> treatment needs · WHO probe · 0 none, 1 OHI, 2 + SRP, 3 + surgery</li></ul><b>GPI</b> = gingival index + periodontal index.",s:"Indices slide 50–53"},
 {d:"Indices",f:"Treatment Priority Index",b:"<b>Malocclusion.</b> 0 normal · 1–3 minor · 4–6 definite, elective · 7–9 severe handicap, highly desired · over 10 very severe, mandatory.",s:"Indices slide 55"},
 {d:"Indices",f:"Four fluorosis indices: what makes each different",b:"<ul><li><b>DDE:</b> any opacity regardless of origin · two worst teeth, score the less damaged</li><li><b>Dean’s:</b> populations · second-worst tooth in each quadrant</li><li><b>Fluorosis Risk Index:</b> Class I first year of life · Class II years 3–6</li><li><b>TSIF:</b> scores 0–7 by surface</li></ul>DDE and Dean’s: dry 2 minutes.",s:"Indices slide 56–59"},
 {d:"Sealants",f:"Define a pit and fissure sealant",b:"A <b>thin plastic resinous coating</b> that acts as a <b>physical barrier</b> to oral bacteria and carbohydrates. Best placed before cavitation.",s:"Sealants slide 5 ★"},
 {d:"Sealants",f:"Preventive vs therapeutic sealant",b:"<b>Preventive:</b> healthy, sound, caries-free tooth (primary prevention).<br><b>Therapeutic:</b> early, non-cavitated enamel lesion; minor superficial drilling may occur (secondary).",s:"Sealants slide 2, 6 ★"},
 {d:"Sealants",f:"Sealant numbers: 90%, 76%, 20% vs 32%",b:"<b>90%</b> of caries in permanent teeth is in pits and fissures. <b>76%</b> reduction in risk of new lesions with sealants. <b>Under 20%</b> of children in poverty have sealants vs <b>32%</b> in higher-income homes.",s:"Sealants slide 4"},
 {d:"Sealants",f:"Contraindications for sealants",b:"Uncooperative patient · clinically evident caries · proximal decay · insufficiently erupted / operculum · primary tooth with short life expectancy · radiographic decay · self-cleaning pits · methacrylate allergy · previous restoration",s:"Sealants slide 10"},
 {d:"Sealants",f:"Most common reason a sealant fails",b:"<b>Salivary contamination</b> during placement. The surface must be clean and completely dry.",s:"Sealants slide 11–12 ★"},
 {d:"Sealants",f:"Sealant placement steps",b:"<ol><li>Clean and isolate</li><li>Etch (37% phosphoric acid)</li><li>Rinse</li><li>Dry</li><li>Bonding (optional)</li><li>Place sealant</li><li>Cure</li><li>Wipe (oxygen-inhibited layer)</li></ol>Then bite check, retention check, fluoride.",s:"Sealants slide 20"},
 {d:"Sealants",f:"Sealant times",b:"<ul><li>Etch <b>15–60 s</b></li><li>Rinse <b>at least 30 s</b></li><li>Dry <b>15–20 s</b></li><li>Spread, wait <b>10 s</b></li><li>Cure <b>20–30 s</b></li><li>Re-etch after a failure: about <b>15 s</b></li><li>Recheck every <b>6 months</b></li></ul>",s:"Sealants slide 22–29"},
 {d:"Sealants",f:"What does etch do, and how does the tooth look?",b:"Creates <b>micropores</b> so resin can penetrate and bond. Also removes contamination, antibacterial, more surface area. Tooth looks <b>chalky white</b>. Keep it off oral tissues.",s:"Sealants slide 13, 22 ★"},
 {d:"Sealants",f:"Monomer → polymer",b:"Liquid sealant = resin = <b>monomer</b>. <b>Polymerization</b> hardens it. Hard sealant = <b>polymer</b>.<br>Self-cure starts when mixing begins. Light-cure needs the blue light.",s:"Sealants slide 17–18 ★"},
 {d:"Sealants",f:"Filled vs unfilled sealants",b:"<b>Unfilled</b> wear down to the correct height. <b>Filled</b> require adjustment. Check with articulating paper; remove excess with a scaler or curette; floss the contacts.",s:"Sealants slide 26"},
 {d:"Sealants",f:"Diagnodent values",b:"<ul><li><b>0–14</b> no active care</li><li><b>15–20</b> no active care, prevention recommended</li><li><b>21–30</b> preventive or active care, by caries risk</li><li><b>Over 30</b> active treatment</li></ul>Detection: explorer 57% · radiographs 67% · Diagnodent 90%.",s:"Sealants slide 31, 33"},
 {d:"NSPT",f:"Flora before and after treatment",b:"<b>Before:</b> anaerobic · gram-negative · motile · spirochetes · high counts · many leukocytes.<br><b>After:</b> aerobic · gram-positive · nonmotile · coccoid · lower counts.",s:"SRP slide 7"},
 {d:"NSPT",f:"Calculus and cementum: the two rules",b:"<b>Calculus is not a direct cause</b> of inflammation; it retains biofilm.<br><b>Preserve cementum</b>: it is a source of growth factors for new attachment.",s:"SRP slide 17–18 ★"},
 {d:"NSPT",f:"Appointment planning numbers",b:"Quadrant appointments at <b>1-week</b> intervals. Stage I–II: <b>2 quads</b> per visit. Re-evaluate <b>4–8 weeks</b> after finishing. Finish a quad before starting the next.",s:"SRP slide 26"},
 {d:"NSPT",f:"Informed consent: what it covers",b:"Expected outcomes · risks · unexpected results · alternatives · consequences of refusal · costs · capacity to consent · <b>written</b> consent (most legally sound). Refusal gets a refusal form.",s:"SRP slide 22–24"},
 {d:"Roots",f:"Maxillary first molar roots",b:"<b>Trifurcated:</b> MB, DB, palatal. Furcations on the <b>facial, mesial, distal</b>. Buccal furcation is the easy one to reach.",s:"SRP slide 34 class note"},
 {d:"Roots",f:"Mandibular first molar roots",b:"<b>Two roots:</b> mesial (larger) and distal. <b>Facial and lingual</b> furcations. Concavity on the mesial root. Furcation begins just apical to the CEJ.",s:"SRP slide 41 class note"},
 {d:"Roots",f:"Maxillary first premolar roots",b:"<b>Bifurcated:</b> buccal and lingual. <b>Prominent mesial concavity.</b> Furcations mesial and distal, in the apical third.",s:"SRP slide 32 class note"},
 {d:"Roots",f:"Second molars vs first molars",b:"<b>Longer root trunk</b>; roots closer together. Mandibular second molar roots curve distally and may have cervical enamel projections.",s:"SRP slide 35, 42 class note"},
 {d:"Roots",f:"Variations in root form",b:"Fused roots, fusion, concrescence · accessory roots · palatogingival grooves · hypercementosis · cervical enamel projections · enamel pearls · dilaceration",s:"SRP slide 45"},
 {d:"Hand",f:"Curette vs powered tip: direction of work",b:"<b>Curette:</b> apical to the deposit, base of the pocket → toward the CEJ.<br><b>Powered tip:</b> coronal part of the deposit near the CEJ → apically.",s:"SRP slide 78"},
 {d:"Hand",f:"Horizontal strokes: which working-end?",b:"<b>Proximal:</b> switch ends. G11 vertical → G12 horizontal. G13 vertical → G14 horizontal.<br><b>Facial / lingual:</b> same end for both.<br>Horizontal strokes are for concavities.",s:"SRP slide 63–69"},
 {d:"Hand",f:"Multi-rooted teeth: sequence and curette choice",b:"Root trunk first, then each root like a single-rooted tooth.<br><b>Distal portion</b> of either root = distal curette. <b>Mesial portion</b> of either root = mesial curette.",s:"SRP slide 56–62 ★"},
 {d:"Hand",f:"Gracey curettes: area of use",b:"<ul><li><b>1/2, 3/4, 5/6</b> anterior, all surfaces</li><li><b>7/8, 9/10</b> posterior buccal and lingual</li><li><b>11/12, 15/16</b> posterior facial, lingual, mesial</li><li><b>13/14, 17/18</b> posterior distal</li></ul>",s:"SRP slide 113"},
 {d:"Hand",f:"Langer curettes",b:"Face at <b>90°</b> to the lower shank · two cutting edges.<br><b>1/2</b> mandibular posterior · <b>3/4</b> maxillary posterior · <b>5/6</b> anterior · <b>17/18</b> posterior.",s:"SRP slide 108, 110 ★"},

/* ============ WHO (profiles) ============ */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let NAME=lsGet("hcl-name")||"";
function profiles(){try{return JSON.parse(lsGet("hcl-profiles")||"[]");}catch(e){return [];}}
function slug(n){return n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-");}
const KEY=NAME?"hcl-v1-"+slug(NAME):"hcl-v1";

/* ============ STATE ============ */
let S={xp:0,ans:{},cards:{},best:0};
try{const raw=lsGet(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}
function floatXP(el,n){const r=el.getBoundingClientRect();const f=document.createElement("div");f.className="float";f.textContent="+"+n+" XP";f.style.left=(r.left+r.width/2-24)+"px";f.style.top=(r.top-6)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}
function addXP(n,el){S.xp+=n;save();renderHUD();if(el)floatXP(el,n);}
function renderHUD(){const lvl=Math.floor(S.xp/100)+1;$("#lvl").textContent="LV "+lvl;$("#xpnum").textContent=S.xp+" XP";$("#xpbar").style.width=(S.xp%100)+"%";}
function srcTag(s){const std=/^Standard/.test(s);return `<span class="src${std?" std":""}">${esc(s)}</span>`;}

/* ============ TESTS (title dropdown) ============ */
const TESTS=[
 {id:"t1",title:"Hygiene Case Lab",menu:"Case Lab",blurb:"Test 1 · four patient cases + anesthetic lab",
  sub:"Case test prep · answers checked against the Litwak Dental Clinic Manual 26–27",
  tabs:[["cases","Cases"],["la","Anesthetic lab"],["cards","Flashcards"],["quiz","Quiz"],["cram","Cram sheet"]],
  note:`<span class="src">Manual p.__</span> means the rule is taken straight from the clinic manual (printed page number). <span class="src std">Standard teaching</span> means the manual doesn’t cover it and the answer comes from standard dental hygiene textbooks. Check those against your class notes, because your instructors grade on what they taught. This is a study aid, not an answer key.`},
 {id:"t2",title:"Hygiene Test 2 Lab",menu:"Test 2 Lab",blurb:"Test 2 · indices, sealants, scaling & root planing",
  sub:"Test 2 prep · built from the Dental Indices, Sealants, and Nonsurgical Periodontal Therapy slides",
  tabs:[["ask","Ask instructor"],["topics","Practice"],["cards","Flashcards"],["quiz","Quiz"],["cram","Cram sheet"]], home:"topics",
  note:`<span class="src">Indices slide __</span> names the slide deck and slide number the answer came from, so you can look it up. <span class="star">★</span> and “class note” mean it was starred or handwritten on the slides. <span class="src std">Standard teaching</span> means the slides don’t say it and the answer comes from standard dental hygiene textbooks. Where a slide and a handwritten note disagree, the answer shows both. This is a study aid, not an answer key.`}
];
let TEST="t1";
function curTest(){return TESTS.find(t=>t.id===TEST);}
function tabKey(){return KEY+"-tab"+(TEST==="t1"?"":"-"+TEST);}
function renderTest(){
  const t=curTest();
  $("#titleText").textContent=t.title; document.title=t.title;
  $("#brandSub").textContent=t.sub; $("#note").innerHTML=t.note;
  $("#tabs").innerHTML=t.tabs.map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="false">${l}</button>`).join("");
  $("#titleMenu").innerHTML=TESTS.map(x=>`<button role="menuitemradio" aria-checked="${x.id===TEST}" data-test="${x.id}">${esc(x.menu)}<small>${esc(x.blurb)}</small></button>`).join("");
}
function setTest(id,startTab){
  TEST=id; lsSet(KEY+"-test",id);
  Q=null; deckFilter="All"; deckOrder=null; cardIdx=0; flipped=false;
  renderTest();
  const ids=curTest().tabs.map(x=>x[0]);
  const home=curTest().home||ids[0];
  let t=startTab||lsGet(tabKey())||home; if(!ids.includes(t))t=home;
  setTab(t);
}

  if(t==="cases")renderCases(); if(t==="ask")renderAsk(); if(t==="topics")renderTopics(); if(t==="la")renderLA(); if(t==="cards")renderCards(); if(t==="quiz")renderQuiz(); if(t==="cram")renderCram();
  lsSet(tabKey(),t);
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.tab);});

/* answering a question: shared by the Cases and Practice views */
function qAct(t,rer){
  const o=t.closest(".opt[data-q]"); if(o){const q=allQ().find(x=>x.id===o.dataset.q);const i=+o.dataset.i;const ok=i===q.ans;S.ans[q.id]={pick:i,ok};save();if(ok){addXP(10,o);toast("Nice. +10 XP");}else toast("Not quite. Read why below.");rer(q);return true;}
  const rv=t.closest("[data-reveal]"); if(rv){const id=rv.dataset.reveal;const ta=$("#ta-"+id);if(ta&&ta.value.trim().length<3){toast("Type your answer first");ta.focus();return true;}S.ans["rev-"+id]=1;save();rer(allQ().find(x=>x.id===id));return true;}
  const sf=t.closest("[data-self]"); if(sf){const id=sf.dataset.self;const ok=sf.dataset.ok==="1";S.ans[id]={ok};save();if(ok)addXP(15,sf);else toast("Flagged for review");rer(allQ().find(x=>x.id===id));return true;}
  const rd=t.closest("[data-redo]"); if(rd){const id=rd.dataset.redo;delete S.ans[id];delete S.ans["rev-"+id];save();rer(allQ().find(x=>x.id===id));return true;}
  return false;
}

/* ============ CASES ============ */
let curCase=CASES[0].id, qFilter="All";
function caseChips(){return `<div class="chips">${CASES.map(c=>{const n=c.qs.length,d=c.qs.filter(q=>S.ans[q.id]).length;return `<button class="chip" data-case="${c.id}" aria-pressed="${c.id===curCase}">${esc(c.name)} <small>${d}/${n}</small></button>`;}).join("")}${PENDING.map(p=>`<button class="chip locked" disabled title="Send the case file and it gets added">${p} <small>waiting on file</small></button>`).join("")}</div>`;}

    <div class="lbl">Social / dental history</div><p style="margin:0">${esc(c.social)}</p>
  </div>`;
}
function qHTML(q){
  const st=S.ans[q.id];
  let cls="q"+(st?(st.ok?" done-good":" done-bad"):"");
  let body="";
  if(q.type==="mc"){
    body=`<div class="opts">${q.opts.map((o,i)=>{let c="opt";if(st){if(i===q.ans)c+=" right";else if(i===st.pick)c+=" wrong";}return `<button class="${c}" data-q="${q.id}" data-i="${i}" ${st?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
    if(st) body+=`<div class="why">${q.why}${q.defend?`<div class="defend"><b>Be ready to defend it:</b> ${q.defend}</div>`:""}<div>${srcTag(q.src)}</div></div>`;
  }else{
    const draft=(S.ans["draft-"+q.id]||"");
    body=`<textarea id="ta-${q.id}" data-draft="${q.id}" placeholder="Type your answer first, then check it…">${esc(draft)}</textarea>`;
    if(!S.ans["rev-"+q.id]) body+=`<div class="row"><button class="btn acc" data-reveal="${q.id}">Check my answer</button></div>`;
    else{
      body+=`<div class="why"><div class="model">Model answer</div>${q.model}<div>${srcTag(q.src)}</div></div>`;
      body+= st?`<div class="row"><span class="muted" style="font-size:14px">${st.ok?"You marked this as nailed.":"Marked to review again."}</span><button class="btn soft" data-redo="${q.id}">Try again</button></div>`
               :`<div class="row"><button class="btn good" data-self="${q.id}" data-ok="1">I had it</button><button class="btn bad" data-self="${q.id}" data-ok="0">I missed stuff</button></div>`;
    }
  }
  return `<div class="${cls}" id="q-${q.id}"><div class="topic">${esc(q.topic)}</div><div class="prompt">${esc(q.q)}</div>${body}</div>`;
}
function renderCases(){

$("#view-cases").addEventListener("click",e=>{
